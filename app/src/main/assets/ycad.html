    // OSNAP Engine
    function findClosestSnap(wx, wy) {
      if (!state.osnapEnabled) return null;
      const m = state.osnapModes;
      const threshold = 20 / state.cam.zoom;
      let best = null, bestScore = threshold;

      function consider(px, py, mode, label, priorityBonus = 1.0) {
        if (!m[mode]) return;
        const d = Math.hypot(px - wx, py - wy);
        if (d <= threshold && (d * priorityBonus) < bestScore) {
          bestScore = d * priorityBonus;
          best = { x: px, y: py, mode, label };
        }
      }

      const { segments, circles } = extractSegmentsAndCircles();
      const refPt = state.tempPoints.length > 0 ? state.tempPoints[state.tempPoints.length - 1] : null;

      for (const s of segments) {
        consider(s.x1, s.y1, 'END', '끝점(END)', 0.75);
        consider(s.x2, s.y2, 'END', '끝점(END)', 0.75);
        consider((s.x1 + s.x2) / 2, (s.y1 + s.y2) / 2, 'MID', '중간점(MID)', 0.8);
        const dx = s.x2 - s.x1, dy = s.y2 - s.y1, lenSq = dx * dx + dy * dy;
        if (lenSq > 1e-6) {
          if (refPt && m.PERP) {
            const u = ((refPt.x - s.x1) * dx + (refPt.y - s.y1) * dy) / lenSq;
            if (u >= -0.05 && u <= 1.05) consider(s.x1 + u * dx, s.y1 + u * dy, 'PERP', '수직점(PERP)', 0.82);
          }
          if (m.NEAR) {
            let t = ((wx - s.x1) * dx + (wy - s.y1) * dy) / lenSq;
            t = Math.max(0, Math.min(1, t));
            consider(s.x1 + t * dx, s.y1 + t * dy, 'NEAR', '근처점(NEAR)', 1.25);
          }
        }
      }

      for (const c of circles) {
        consider(c.cx, c.cy, 'CEN', '중심점(CEN)', 0.78);
        consider(c.cx + c.r, c.cy, 'QUAD', '사분점(QUAD)', 0.85);
        consider(c.cx - c.r, c.cy, 'QUAD', '사분점(QUAD)', 0.85);
        consider(c.cx, c.cy + c.r, 'QUAD', '사분점(QUAD)', 0.85);
        consider(c.cx, c.cy - c.r, 'QUAD', '사분점(QUAD)', 0.85);
        if (c.type === 'arc') {
          const sa = c.startAngle || 0, ea = c.endAngle || Math.PI;
          consider(c.cx + Math.cos(sa) * c.r, c.cy + Math.sin(sa) * c.r, 'END', '호 끝점(END)', 0.75);
          consider(c.cx + Math.cos(ea) * c.r, c.cy + Math.sin(ea) * c.r, 'END', '호 끝점(END)', 0.75);
        }
        if (refPt && m.TAN) {
          const dx = c.cx - refPt.x, dy = c.cy - refPt.y, dist = Math.hypot(dx, dy);
          if (dist > c.r) {
            const baseAng = Math.atan2(-dy, -dx), offsetAng = Math.acos(c.r / dist);
            consider(c.cx + c.r * Math.cos(baseAng + offsetAng), c.cy + c.r * Math.sin(baseAng + offsetAng), 'TAN', '접점(TAN)', 0.82);
            consider(c.cx + c.r * Math.cos(baseAng - offsetAng), c.cy + c.r * Math.sin(baseAng - offsetAng), 'TAN', '접점(TAN)', 0.82);
          }
        }
        if (refPt && m.PERP) {
          const ang = Math.atan2(refPt.y - c.cy, refPt.x - c.cx);
          consider(c.cx + c.r * Math.cos(ang), c.cy + c.r * Math.sin(ang), 'PERP', '수직점(PERP)', 0.85);
        }
        if (m.NEAR) {
          const ang = Math.atan2(wy - c.cy, wx - c.cx);
          consider(c.cx + c.r * Math.cos(ang), c.cy + c.r * Math.sin(ang), 'NEAR', '근처점(NEAR)', 1.25);
        }
      }

      if (m.NODE) {
        for (const e of state.entities) {
          if ((e.space || 'Model') !== state.space || !isLayerVisible(e.layer)) continue;
          if (e.x !== undefined && e.y !== undefined) consider(e.x, e.y, 'NODE', '노드(NODE)', 0.78);
        }
      }

      if (m.INT) {
        for (let i = 0; i < segments.length; i++) {
          for (let j = i + 1; j < segments.length; j++) {
            const pt = intersectSegSeg(segments[i], segments[j]);
            if (pt) consider(pt.x, pt.y, 'INT', '교차점(INT)', 0.72);
          }
          for (const cir of circles) {
            for (const pt of intersectSegCircle(segments[i], cir)) consider(pt.x, pt.y, 'INT', '교차점(INT)', 0.72);
          }
        }
        for (let i = 0; i < circles.length; i++) {
          for (let j = i + 1; j < circles.length; j++) {
            for (const pt of intersectCircleCircle(circles[i], circles[j])) consider(pt.x, pt.y, 'INT', '교차점(INT)', 0.72);
          }
        }
      }
      return best;
    }

    function drawOsnapMarker(targetCtx, snap) {
      const sp = worldToScreen(snap.x, snap.y, 0);
      const r = 6.5;
      targetCtx.save();
      targetCtx.strokeStyle = '#10b981';
      targetCtx.fillStyle = '#10b981';
      targetCtx.lineWidth = 2.0;

      if (snap.mode === 'END') targetCtx.strokeRect(sp.x - r, sp.y - r, r * 2, r * 2);
      else if (snap.mode === 'MID') {
        targetCtx.beginPath();
        targetCtx.moveTo(sp.x, sp.y - r - 1); targetCtx.lineTo(sp.x - r - 1, sp.y + r); targetCtx.lineTo(sp.x + r + 1, sp.y + r);
        targetCtx.closePath(); targetCtx.stroke();
      } else if (snap.mode === 'CEN') {
        targetCtx.beginPath(); targetCtx.arc(sp.x, sp.y, r, 0, Math.PI * 2); targetCtx.stroke();
      } else if (snap.mode === 'INT') {
        targetCtx.beginPath();
        targetCtx.moveTo(sp.x - r, sp.y - r); targetCtx.lineTo(sp.x + r, sp.y + r);
        targetCtx.moveTo(sp.x + r, sp.y - r); targetCtx.lineTo(sp.x - r, sp.y + r);
        targetCtx.stroke();
      } else if (snap.mode === 'QUAD') {
        targetCtx.beginPath();
        targetCtx.moveTo(sp.x, sp.y - r - 1); targetCtx.lineTo(sp.x + r + 1, sp.y);
        targetCtx.lineTo(sp.x, sp.y + r + 1); targetCtx.lineTo(sp.x - r - 1, sp.y);
        targetCtx.closePath(); targetCtx.stroke();
      } else if (snap.mode === 'PERP') {
        targetCtx.beginPath();
        targetCtx.moveTo(sp.x - r, sp.y + r); targetCtx.lineTo(sp.x + r, sp.y + r);
        targetCtx.moveTo(sp.x, sp.y + r); targetCtx.lineTo(sp.x, sp.y - r);
        targetCtx.strokeRect(sp.x, sp.y, r * 0.55, r * 0.55); targetCtx.stroke();
      } else if (snap.mode === 'TAN') {
        targetCtx.beginPath();
        targetCtx.arc(sp.x, sp.y, r - 1, 0, Math.PI * 2);
        targetCtx.moveTo(sp.x - r - 1, sp.y - r); targetCtx.lineTo(sp.x + r + 1, sp.y - r);
        targetCtx.stroke();
      } else if (snap.mode === 'NODE') {
        targetCtx.beginPath();
        targetCtx.arc(sp.x, sp.y, r - 1, 0, Math.PI * 2);
        targetCtx.moveTo(sp.x - r - 2, sp.y); targetCtx.lineTo(sp.x + r + 2, sp.y);
        targetCtx.moveTo(sp.x, sp.y - r - 2); targetCtx.lineTo(sp.x, sp.y + r + 2);
        targetCtx.stroke();
      } else {
        targetCtx.beginPath();
        targetCtx.moveTo(sp.x - r, sp.y - r); targetCtx.lineTo(sp.x + r, sp.y - r);
        targetCtx.lineTo(sp.x - r, sp.y + r); targetCtx.lineTo(sp.x + r, sp.y + r);
        targetCtx.closePath(); targetCtx.stroke();
      }

      targetCtx.font = "bold 10px monospace";
      const tw = targetCtx.measureText(snap.label).width + 8;
      targetCtx.fillStyle = 'rgba(6, 78, 59, 0.92)';
      targetCtx.fillRect(sp.x + 10, sp.y - 18, tw, 15);
      targetCtx.fillStyle = '#6ee7b7';
      targetCtx.fillText(snap.label, sp.x + 14, sp.y - 7);
      targetCtx.restore();
    }

    function getEntityGrips(e) {
      const grips = [];
      if (e.type === 'line' || e.type === 'dim_linear' || e.type === 'dim_aligned') {
        grips.push({ id: e.id, role: 'p1', x: e.x1, y: e.y1 });
        grips.push({ id: e.id, role: 'p2', x: e.x2, y: e.y2 });
        grips.push({ id: e.id, role: 'mid', x: (e.x1 + e.x2) / 2, y: (e.y1 + e.y2) / 2 });
      } else if (e.type === 'circle') {
        grips.push({ id: e.id, role: 'center', x: e.cx, y: e.cy });
        grips.push({ id: e.id, role: 'radius', x: e.cx + e.r, y: e.cy });
      } else if (e.type === 'rect' || e.type === 'markup_rect' || e.type === 'hatch') {
        grips.push({ id: e.id, role: 'p1', x: e.x1, y: e.y1 });
        grips.push({ id: e.id, role: 'p2', x: e.x2, y: e.y2 });
        grips.push({ id: e.id, role: 'center', x: (e.x1 + e.x2) / 2, y: (e.y1 + e.y2) / 2 });
      } else if (e.type === 'arc') {
        grips.push({ id: e.id, role: 'center', x: e.cx, y: e.cy });
        grips.push({ id: e.id, role: 'radius', x: e.cx + e.r * Math.cos(e.startAngle || 0), y: e.cy + e.r * Math.sin(e.startAngle || 0) });
      } else if (e.type === 'polyline' || e.type === 'revcloud' || e.type === 'brush') {
        (e.points || []).forEach((pt, idx) => grips.push({ id: e.id, role: 'pt_' + idx, x: pt.x, y: pt.y }));
      } else if (e.x !== undefined) {
        grips.push({ id: e.id, role: 'pos', x: e.x, y: e.y });
      }
      return grips;
    }

    function applyGripMove(grip, nx, ny) {
      const e = state.entities.find(item => item.id === grip.id);
      if (!e) return;
      if (grip.role === 'p1') { e.x1 = nx; e.y1 = ny; }
      else if (grip.role === 'p2') { e.x2 = nx; e.y2 = ny; }
      else if (grip.role === 'mid' || grip.role === 'center') {
        if (e.type === 'circle' || e.type === 'arc') { e.cx = nx; e.cy = ny; }
        else {
          const cx = (e.x1 + e.x2) / 2, cy = (e.y1 + e.y2) / 2;
          const dx = nx - cx, dy = ny - cy;
          e.x1 += dx; e.y1 += dy; e.x2 += dx; e.y2 += dy;
        }
      } else if (grip.role === 'radius') {
        e.r = Math.max(2, Math.hypot(nx - e.cx, ny - e.cy));
      } else if (grip.role === 'pos') {
        e.x = nx; e.y = ny;
      } else if (grip.role.startsWith('pt_')) {
        const idx = parseInt(grip.role.split('_')[1], 10);
        if (e.points && e.points[idx]) { e.points[idx].x = nx; e.points[idx].y = ny; }
      }
    }

    function translateEntity(e, dx, dy) {
      if (e.x1 !== undefined) { e.x1 += dx; e.y1 += dy; e.x2 += dx; e.y2 += dy; }
      if (e.cx !== undefined) { e.cx += dx; e.cy += dy; }
      if (e.x !== undefined) { e.x += dx; e.y += dy; }
      if (e.points) e.points = e.points.map(p => ({ x: p.x + dx, y: p.y + dy }));
    }

    function rotatePoint(px, py, ox, oy, rad) {
      const cos = Math.cos(rad), sin = Math.sin(rad);
      const dx = px - ox, dy = py - oy;
      return { x: ox + dx * cos - dy * sin, y: oy + dx * sin + dy * cos };
    }

    function rotateEntity(e, ox, oy, deg) {
      const rad = (deg * Math.PI) / 180;
      if (e.type === 'rect') {
        const pts = [
          { x: e.x1, y: e.y1 }, { x: e.x2, y: e.y1 },
          { x: e.x2, y: e.y2 }, { x: e.x1, y: e.y2 }
        ].map(p => rotatePoint(p.x, p.y, ox, oy, rad));
        e.type = 'polyline'; e.closed = true; e.points = pts;
        delete e.x1; delete e.y1; delete e.x2; delete e.y2;
        return;
      }
      if (e.x1 !== undefined) {
        const p1 = rotatePoint(e.x1, e.y1, ox, oy, rad);
        const p2 = rotatePoint(e.x2, e.y2, ox, oy, rad);
        e.x1 = p1.x; e.y1 = p1.y; e.x2 = p2.x; e.y2 = p2.y;
      }
      if (e.cx !== undefined) {
        const c = rotatePoint(e.cx, e.cy, ox, oy, rad);
        e.cx = c.x; e.cy = c.y;
        if (e.startAngle !== undefined) { e.startAngle += rad; e.endAngle += rad; }
      }
      if (e.x !== undefined) {
        const p = rotatePoint(e.x, e.y, ox, oy, rad);
        e.x = p.x; e.y = p.y;
        e.rotation = (e.rotation || 0) + deg;
      }
      if (e.points) e.points = e.points.map(p => rotatePoint(p.x, p.y, ox, oy, rad));
    }

    function scaleEntity(e, ox, oy, factor) {
      if (factor <= 0.005) return;
      if (e.x1 !== undefined) {
        e.x1 = ox + (e.x1 - ox) * factor; e.y1 = oy + (e.y1 - oy) * factor;
        e.x2 = ox + (e.x2 - ox) * factor; e.y2 = oy + (e.y2 - oy) * factor;
      }
      if (e.cx !== undefined) {
        e.cx = ox + (e.cx - ox) * factor; e.cy = oy + (e.cy - oy) * factor;
        if (e.r) e.r *= factor;
      }
      if (e.x !== undefined) {
        e.x = ox + (e.x - ox) * factor; e.y = oy + (e.y - oy) * factor;
        if (e.fontSize) e.fontSize = Math.max(8, e.fontSize * factor);
        if (e.scale) e.scale *= factor;
      }
      if (e.points) e.points = e.points.map(p => ({ x: ox + (p.x - ox) * factor, y: oy + (p.y - oy) * factor }));
    }

    function mirrorPoint(px, py, x1, y1, x2, y2) {
      const dx = x2 - x1, dy = y2 - y1;
      const lenSq = dx * dx + dy * dy;
      if (lenSq < 1e-6) return { x: px, y: py };
      const u = ((px - x1) * dx + (py - y1) * dy) / lenSq;
      const projX = x1 + u * dx, projY = y1 + u * dy;
      return { x: 2 * projX - px, y: 2 * projY - py };
    }

    function mirrorEntityClone(orig, x1, y1, x2, y2) {
      const e = JSON.parse(JSON.stringify(orig));
      e.id = genId();
      if (e.x1 !== undefined) {
        const p1 = mirrorPoint(e.x1, e.y1, x1, y1, x2, y2);
        const p2 = mirrorPoint(e.x2, e.y2, x1, y1, x2, y2);
        e.x1 = p1.x; e.y1 = p1.y; e.x2 = p2.x; e.y2 = p2.y;
      }
      if (e.cx !== undefined) {
        const c = mirrorPoint(e.cx, e.cy, x1, y1, x2, y2);
        e.cx = c.x; e.cy = c.y;
      }
      if (e.x !== undefined) {
        const p = mirrorPoint(e.x, e.y, x1, y1, x2, y2);
        e.x = p.x; e.y = p.y;
      }
      if (e.points) e.points = e.points.map(p => mirrorPoint(p.x, p.y, x1, y1, x2, y2));
      return e;
    }

    function distToSegment(px, py, x1, y1, x2, y2) {
      const dx = x2 - x1, dy = y2 - y1;
      const lenSq = dx * dx + dy * dy;
      if (lenSq === 0) return Math.hypot(px - x1, py - y1);
      let t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
    }

    function hitTestEntity(wx, wy) {
      const tol = 14 / state.cam.zoom;
      for (let i = state.entities.length - 1; i >= 0; i--) {
        const e = state.entities[i];
        if ((e.space || 'Model') !== state.space || !isLayerVisible(e.layer)) continue;
        if (e.type === 'line' || e.type === 'dim_linear' || e.type === 'dim_aligned') {
          if (distToSegment(wx, wy, e.x1, e.y1, e.x2, e.y2) <= tol) return e;
        } else if (e.type === 'circle' || e.type === 'arc' || e.type === 'dim_radial') {
          if (Math.abs(Math.hypot(wx - e.cx, wy - e.cy) - e.r) <= tol) return e;
        } else if (e.type === 'rect' || e.type === 'markup_rect' || e.type === 'hatch') {
          const minX = Math.min(e.x1, e.x2), maxX = Math.max(e.x1, e.x2);
          const minY = Math.min(e.y1, e.y2), maxY = Math.max(e.y1, e.y2);
          const nearEdge =
            (wx >= minX - tol && wx <= maxX + tol && (Math.abs(wy - minY) <= tol || Math.abs(wy - maxY) <= tol)) ||
            (wy >= minY - tol && wy <= maxY + tol && (Math.abs(wx - minX) <= tol || Math.abs(wx - maxX) <= tol));
          if (nearEdge || (e.type === 'hatch' && wx >= minX && wx <= maxX && wy >= minY && wy <= maxY)) return e;
        } else if (e.type === 'polyline' || e.type === 'revcloud' || e.type === 'brush') {
          const pts = e.points || [];
          for (let j = 0; j < pts.length - 1; j++) {
            if (distToSegment(wx, wy, pts[j].x, pts[j].y, pts[j + 1].x, pts[j + 1].y) <= tol) return e;
          }
          if (e.closed && pts.length > 2) {
            if (distToSegment(wx, wy, pts[pts.length - 1].x, pts[pts.length - 1].y, pts[0].x, pts[0].y) <= tol) return e;
          }
        } else if (e.x !== undefined || e.cx !== undefined) {
          if (Math.hypot(wx - (e.x || e.cx || 0), wy - (e.y || e.cy || 0)) <= tol * 3.5) return e;
        }
      }
      return null;
    }

    function selectEntitiesByBox(w1, w2) {
      const isCrossing = w2.x < w1.x;
      const minX = Math.min(w1.x, w2.x), maxX = Math.max(w1.x, w2.x);
      const minY = Math.min(w1.y, w2.y), maxY = Math.max(w1.y, w2.y);
      function ptIn(x, y) { return x >= minX && x <= maxX && y >= minY && y <= maxY; }

      for (const e of state.entities) {
        if ((e.space || 'Model') !== state.space || !isLayerVisible(e.layer)) continue;
        let pts = [];
        if (e.x1 !== undefined) pts = [{ x: e.x1, y: e.y1 }, { x: e.x2, y: e.y2 }, { x: (e.x1 + e.x2) / 2, y: (e.y1 + e.y2) / 2 }];
        else if (e.cx !== undefined) pts = [{ x: e.cx - e.r, y: e.cy }, { x: e.cx + e.r, y: e.cy }, { x: e.cx, y: e.cy - e.r }, { x: e.cx, y: e.cy + e.r }];
        else if (e.points) pts = e.points;
        else if (e.x !== undefined) pts = [{ x: e.x, y: e.y }];
        if (pts.length === 0) continue;
        const match = isCrossing ? pts.some(p => ptIn(p.x, p.y)) : pts.every(p => ptIn(p.x, p.y));
        if (match) state.selectedIds.add(e.id);
      }
    }

    function zoomExtents() {
      let visibleEnts = state.entities.filter(e => (e.space || 'Model') === state.space && isLayerVisible(e.layer));
      if (visibleEnts.length === 0 && state.entities.length > 0) {
        // Fallback if entities are in another space
        state.space = state.entities[0].space || 'Model';
        document.getElementById('currentSpaceBadge').textContent = state.space;
        visibleEnts = state.entities.filter(e => isLayerVisible(e.layer));
      }
      if (visibleEnts.length === 0) {
        state.cam.x = 0; state.cam.y = 0; state.cam.zoom = 1.0;
        updateZoomLabel();
        drawCanvas();
        return;
      }

      const xs = [], ys = [];
      function collect(x, y) {
        if (Number.isFinite(x) && Number.isFinite(y) && Math.abs(x) < 1e12 && Math.abs(y) < 1e12) {
          xs.push(x); ys.push(y);
        }
      }
      for (const e of visibleEnts) {
        if (e.x1 !== undefined) { collect(e.x1, e.y1); collect(e.x2, e.y2); }
        if (e.cx !== undefined && Number.isFinite(e.r)) {
          collect(e.cx - e.r, e.cy - e.r); collect(e.cx + e.r, e.cy + e.r);
        }
        if (e.x !== undefined) {
          const span = (e.fontSize || 15) * 2;
          collect(e.x, e.y); collect(e.x + span, e.y + span * 0.5);
        }
        if (e.points) e.points.forEach(p => collect(p.x, p.y));
      }

      if (xs.length === 0) {
        state.cam.x = 0; state.cam.y = 0; state.cam.zoom = 1.0;
        updateZoomLabel();
        drawCanvas();
        return;
      }

      // Outlier-resistant bounding box: if a few stray points sit at (0,0) while 95% of the drawing is at TM coordinates (e.g. 200000, 500000), trim 2% extreme outliers if they blow up the bbox > 20x
      xs.sort((a, b) => a - b);
      ys.sort((a, b) => a - b);
      let minX = xs[0], maxX = xs[xs.length - 1];
      let minY = ys[0], maxY = ys[ys.length - 1];

      if (xs.length >= 20) {
        const p02 = Math.floor(xs.length * 0.02);
        const p98 = Math.min(xs.length - 1, Math.ceil(xs.length * 0.98));
        const coreW = Math.max(1e-3, xs[p98] - xs[p02]);
        const coreH = Math.max(1e-3, ys[p98] - ys[p02]);
        const fullW = maxX - minX, fullH = maxY - minY;
        if (fullW > coreW * 15 || fullH > coreH * 15) {
          minX = xs[p02]; maxX = xs[p98];
          minY = ys[p02]; maxY = ys[p98];
        }
      }

      const w = Math.max(1e-2, maxX - minX);
      const h = Math.max(1e-2, maxY - minY);
      state.cam.x = (minX + maxX) / 2;
      state.cam.y = (minY + maxY) / 2;
      const cw = Math.max(320, canvas.width), ch = Math.max(240, canvas.height);
      // Unrestricted zoom range (1e-6 to 1e6) so both millimeter details and kilometer site maps fit the screen!
      state.cam.zoom = Math.max(1e-6, Math.min(1e6, Math.min((cw * 0.82) / w, (ch * 0.82) / h)));
      updateZoomLabel();
      drawCanvas();
    }

    function updateZoomLabel() {
      const el = document.getElementById('zoomLevelTxt');
      if (el) el.textContent = Math.round(state.cam.zoom * 100) + '%';
    }

    function getLinetypeDash(ltName) {
      const found = LINETYPES.find(l => l.id === ltName);
      return found ? found.dash : [];
    }

    function renderSingleEntity(targetCtx, e, strokeCol, isSelected, isGhost = false) {
      targetCtx.strokeStyle = strokeCol;
      targetCtx.fillStyle = strokeCol;
      targetCtx.lineWidth = isSelected ? 2.6 : (e.lineWidth || 1.7);
      if (isGhost) targetCtx.setLineDash([5, 4]);
      else if (isSelected) targetCtx.setLineDash([6, 3]);
      else targetCtx.setLineDash(getLinetypeDash(e.linetype || 'CONTINUOUS'));

      const h3d = state.viewMode === '2D' ? 0 : (e.height3D || 40);

      if (e.type === 'line') {
        const p1 = worldToScreen(e.x1, e.y1, 0), p2 = worldToScreen(e.x2, e.y2, 0);
        targetCtx.beginPath(); targetCtx.moveTo(p1.x, p1.y); targetCtx.lineTo(p2.x, p2.y); targetCtx.stroke();
        if (state.viewMode !== '2D' && h3d > 0) {
          const t1 = worldToScreen(e.x1, e.y1, h3d), t2 = worldToScreen(e.x2, e.y2, h3d);
          targetCtx.beginPath();
          targetCtx.moveTo(t1.x, t1.y); targetCtx.lineTo(t2.x, t2.y);
          targetCtx.moveTo(p1.x, p1.y); targetCtx.lineTo(t1.x, t1.y);
          targetCtx.moveTo(p2.x, p2.y); targetCtx.lineTo(t2.x, t2.y);
          targetCtx.stroke();
        }
      } else if (e.type === 'hatch') {
        drawHatchEntity(targetCtx, e, strokeCol);
      } else if (e.type === 'field_pin') {
        const p = worldToScreen(e.x, e.y, 0);
        targetCtx.setLineDash([]);
        targetCtx.fillStyle = e.status === '불량(NG)' ? '#ef4444' : '#10b981';
        targetCtx.beginPath(); targetCtx.arc(p.x, p.y - 10, 10, 0, Math.PI * 2); targetCtx.fill();
        targetCtx.beginPath(); targetCtx.moveTo(p.x - 6, p.y - 4); targetCtx.lineTo(p.x, p.y + 6); targetCtx.lineTo(p.x + 6, p.y - 4); targetCtx.fill();
        targetCtx.fillStyle = '#ffffff';
        targetCtx.font = "bold 9px monospace";
        targetCtx.fillText(e.pinCode || 'PIN', p.x - 10, p.y - 7);
        targetCtx.fillStyle = '#a7f3d0';
        targetCtx.font = "bold 10px sans-serif";
        targetCtx.fillText(`📍[${e.pinCode}] ${e.title}`, p.x + 13, p.y - 5);
      } else if (e.type === 'point_node') {
        const p = worldToScreen(e.x, e.y, 0);
        targetCtx.beginPath();
        targetCtx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        targetCtx.moveTo(p.x - 8, p.y); targetCtx.lineTo(spX(p.x + 8), p.y);
        targetCtx.moveTo(p.x, p.y - 8); targetCtx.lineTo(p.x, p.y + 8);
        targetCtx.stroke();
      } else if (e.type === 'rect' || e.type === 'markup_rect') {
        const corners = [
          { x: e.x1, y: e.y1 }, { x: e.x2, y: e.y1 },
          { x: e.x2, y: e.y2 }, { x: e.x1, y: e.y2 }
        ];
        drawPolygon3D(targetCtx, corners, true, h3d, strokeCol, e.type === 'markup_rect');
      } else if (e.type === 'polyline' || e.type === 'brush') {
        drawPolygon3D(targetCtx, e.points || [], !!e.closed, e.type === 'brush' ? 0 : h3d, strokeCol, false);
      } else if (e.type === 'revcloud') {
        drawRevCloud(targetCtx, e.points || [], strokeCol);
      } else if (e.type === 'circle') {
        if (state.viewMode === '2D') {
          const c = worldToScreen(e.cx, e.cy, 0);
          targetCtx.beginPath();
          targetCtx.arc(c.x, c.y, Math.max(1, e.r * state.cam.zoom), 0, Math.PI * 2);
          targetCtx.stroke();
        } else {
          const segs = 28, pts = [];
          for (let i = 0; i < segs; i++) {
            const a = (i / segs) * Math.PI * 2;
            pts.push({ x: e.cx + Math.cos(a) * e.r, y: e.cy + Math.sin(a) * e.r });
          }
          drawPolygon3D(targetCtx, pts, true, h3d, strokeCol, false);
        }
      } else if (e.type === 'arc') {
        const c = worldToScreen(e.cx, e.cy, 0);
        targetCtx.beginPath();
        targetCtx.arc(c.x, c.y, Math.max(1, e.r * state.cam.zoom), -(e.endAngle || Math.PI), -(e.startAngle || 0));
        targetCtx.stroke();
      } else if (e.type === 'text' || e.type === 'markup_text') {
        const p = worldToScreen(e.x, e.y, 0);
        const fSize = Math.max(10, Math.min(72, (e.fontSize || 18) * state.cam.zoom * 0.75));
        targetCtx.font = `bold ${fSize}px sans-serif`;
        if (e.type === 'markup_text') {
          const tw = targetCtx.measureText(e.text || '').width + 12;
          targetCtx.fillStyle = 'rgba(244, 63, 94, 0.25)';
          targetCtx.fillRect(p.x - 6, p.y - fSize, tw, fSize + 8);
          targetCtx.strokeRect(p.x - 6, p.y - fSize, tw, fSize + 8);
        }
        targetCtx.fillStyle = strokeCol;
        targetCtx.fillText(e.text || 'TEXT', p.x, p.y);
      } else if (e.type === 'dim_linear' || e.type === 'dim_aligned') {
        drawDimensionLinear(targetCtx, e, strokeCol);
      } else if (e.type === 'dim_radial') {
        drawDimensionRadial(targetCtx, e, strokeCol);
      } else if (e.type === 'dim_angular') {
        drawDimensionAngular(targetCtx, e, strokeCol);
      } else if (e.type === 'dim_arclen') {
        drawDimensionArcLen(targetCtx, e, strokeCol);
      } else if (e.type === 'dim_ordinate') {
        const p = worldToScreen(e.x, e.y, 0);
        targetCtx.beginPath(); targetCtx.moveTo(p.x, p.y); targetCtx.lineTo(p.x + 35, p.y - 25); targetCtx.stroke();
        targetCtx.font = "11px monospace";
        targetCtx.fillText(`X:${e.x.toFixed(1)} Y:${e.y.toFixed(1)}`, p.x + 38, p.y - 25);
      } else if (e.type === 'block_ref') {
        drawBlockRef(targetCtx, e, strokeCol);
      } else if (e.type === 'voice_note') {
        const p = worldToScreen(e.x, e.y, 0);
        targetCtx.fillStyle = '#0ea5e9';
        targetCtx.beginPath(); targetCtx.arc(p.x, p.y, 12, 0, Math.PI * 2); targetCtx.fill();
        targetCtx.fillStyle = '#ffffff';
        targetCtx.font = "bold 10px sans-serif";
        targetCtx.fillText('🔊 ' + (e.label || '음성메모'), p.x + 15, p.y + 4);
      } else if (e.type === 'image_attach') {
        const p = worldToScreen(e.x, e.y, 0);
        const iw = (e.w || 120) * state.cam.zoom, ih = (e.h || 90) * state.cam.zoom;
        if (e.imgObj) targetCtx.drawImage(e.imgObj, p.x, p.y - ih, iw, ih);
        targetCtx.strokeRect(p.x, p.y - ih, iw, ih);
      }
    }

    function spX(v) { return v; }

    function drawHatchEntity(targetCtx, e, strokeCol) {
      const p1 = worldToScreen(e.x1, e.y1, 0), p2 = worldToScreen(e.x2, e.y2, 0);
      const rx = Math.min(p1.x, p2.x), ry = Math.min(p1.y, p2.y);
      const rw = Math.abs(p2.x - p1.x), rh = Math.abs(p2.y - p1.y);
      targetCtx.save();
      targetCtx.beginPath();
      targetCtx.rect(rx, ry, rw, rh);
      targetCtx.strokeStyle = strokeCol;
      targetCtx.stroke();
      targetCtx.clip();

      if (e.pattern === 'SOLID') {
        targetCtx.fillStyle = strokeCol + '44';
        targetCtx.fillRect(rx, ry, rw, rh);
      } else {
        targetCtx.strokeStyle = strokeCol;
        targetCtx.lineWidth = 1;
        const step = Math.max(8, 14 * state.cam.zoom);
        targetCtx.beginPath();
        for (let d = -rh; d < rw + rh; d += step) {
          targetCtx.moveTo(rx + d, ry);
          targetCtx.lineTo(rx + d - rh, ry + rh);
          if (e.pattern === 'ANSI37') {
            targetCtx.moveTo(rx + d, ry);
            targetCtx.lineTo(rx + d + rh, ry + rh);
          }
        }
        targetCtx.stroke();
      }
      targetCtx.restore();
    }

    function renderEntitiesToContext(targetCtx, w, h) {
      targetCtx.save();
      targetCtx.fillStyle = state.bgColor;
      targetCtx.fillRect(0, 0, w, h);

      if (state.gridEnabled) {
        // Dynamic power-of-10 grid spacing so screen always has ~15-40 grid lines regardless of zoom level
        const rawWorldSpan = Math.max(canvas.width, canvas.height) / Math.max(1e-9, state.cam.zoom);
        const pow10 = Math.pow(10, Math.floor(Math.log10(Math.max(1e-6, rawWorldSpan / 12))));
        let gridStep = pow10;
        if (rawWorldSpan / gridStep > 35) gridStep *= 5;
        else if (rawWorldSpan / gridStep > 18) gridStep *= 2;

        targetCtx.strokeStyle = state.bgColor === '#ffffff' ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.05)';
        targetCtx.lineWidth = 1;

        if (state.viewMode === '2D') {
          const tl = screenToWorld(0, 0), br = screenToWorld(w, h);
          const startX = Math.floor(tl.x / gridStep) * gridStep, endX = Math.ceil(br.x / gridStep) * gridStep;
          const startY = Math.floor(br.y / gridStep) * gridStep, endY = Math.ceil(tl.y / gridStep) * gridStep;

          targetCtx.beginPath();
          for (let gx = startX; gx <= endX; gx += gridStep) {
            const sx = worldToScreen(gx, 0).x;
            targetCtx.moveTo(sx, 0); targetCtx.lineTo(sx, h);
          }
          for (let gy = startY; gy <= endY; gy += gridStep) {
            const sy = worldToScreen(0, gy).y;
            targetCtx.moveTo(0, sy); targetCtx.lineTo(w, sy);
          }
          targetCtx.stroke();

          const orig = worldToScreen(0, 0);
          targetCtx.lineWidth = 1.4;
          targetCtx.strokeStyle = '#ef4444';
          targetCtx.beginPath(); targetCtx.moveTo(orig.x, orig.y); targetCtx.lineTo(orig.x + 50, orig.y); targetCtx.stroke();
          targetCtx.strokeStyle = '#22c55e';
          targetCtx.beginPath(); targetCtx.moveTo(orig.x, orig.y); targetCtx.lineTo(orig.x, orig.y - 50); targetCtx.stroke();
        } else {
          for (let g = -250; g <= 250; g += 50) {
            const p1 = worldToScreen(g, -250, 0), p2 = worldToScreen(g, 250, 0);
            const p3 = worldToScreen(-250, g, 0), p4 = worldToScreen(250, g, 0);
            targetCtx.beginPath();
            targetCtx.moveTo(p1.x, p1.y); targetCtx.lineTo(p2.x, p2.y);
            targetCtx.moveTo(p3.x, p3.y); targetCtx.lineTo(p4.x, p4.y);
            targetCtx.stroke();
          }
        }
      }

      for (const e of state.entities) {
        if ((e.space || 'Model') !== state.space || !isLayerVisible(e.layer)) continue;
        const isSelected = state.selectedIds.has(e.id) || (state.tempTargetEntity && state.tempTargetEntity.id === e.id);
        const strokeCol = isSelected ? '#38bdf8' : getEntityColor(e);
        renderSingleEntity(targetCtx, e, strokeCol, isSelected, false);
      }

      targetCtx.setLineDash([]);

      if (state.viewMode === '2D') {
        for (const id of state.selectedIds) {
          const ent = state.entities.find(item => item.id === id);
          if (!ent) continue;
          for (const g of getEntityGrips(ent)) {
            const sp = worldToScreen(g.x, g.y, 0);
            targetCtx.fillStyle = '#2563eb';
            targetCtx.strokeStyle = '#ffffff';
            targetCtx.lineWidth = 1.4;
            targetCtx.fillRect(sp.x - 5, sp.y - 5, 10, 10);
            targetCtx.strokeRect(sp.x - 5, sp.y - 5, 10, 10);
          }
        }
      }

      if (state.polarGuideAngle !== null && state.tempPoints.length > 0 && state.viewMode === '2D') {
        const ref = state.tempPoints[state.tempPoints.length - 1];
        const spRef = worldToScreen(ref.x, ref.y, 0);
        const farPt = worldToScreen(ref.x + Math.cos(state.polarGuideAngle) * 5000, ref.y + Math.sin(state.polarGuideAngle) * 5000, 0);
        targetCtx.save();
        targetCtx.strokeStyle = 'rgba(52, 211, 153, 0.55)';
        targetCtx.lineWidth = 1.2;
        targetCtx.setLineDash([4, 4]);
        targetCtx.beginPath();
        targetCtx.moveTo(spRef.x, spRef.y);
        targetCtx.lineTo(farPt.x, farPt.y);
        targetCtx.stroke();
        targetCtx.restore();
      }

      if (state.tempPoints.length > 0 || state.activeTool === 'clip_paste') {
        drawRubberBandAndGhostPreview(targetCtx);
      }

      if (state.isDragging && state.dragMode === 'box_select') {
        const p1 = worldToScreen(state.dragStartWorld.x, state.dragStartWorld.y, 0);
        const p2 = worldToScreen(state.pointerWorld.x, state.pointerWorld.y, 0);
        const isCrossing = state.pointerWorld.x < state.dragStartWorld.x;
        targetCtx.save();
        targetCtx.strokeStyle = isCrossing ? '#10b981' : '#38bdf8';
        targetCtx.fillStyle = isCrossing ? 'rgba(16, 185, 129, 0.14)' : 'rgba(56, 189, 248, 0.14)';
        targetCtx.lineWidth = 1.5;
        if (isCrossing) targetCtx.setLineDash([6, 4]);
        const rx = Math.min(p1.x, p2.x), ry = Math.min(p1.y, p2.y);
        const rw = Math.abs(p2.x - p1.x), rh = Math.abs(p2.y - p1.y);
        targetCtx.fillRect(rx, ry, rw, rh);
        targetCtx.strokeRect(rx, ry, rw, rh);
        targetCtx.restore();
      }

      if (state.snapPoint) {
        drawOsnapMarker(targetCtx, state.snapPoint);
      }

      targetCtx.restore();
    }

    function drawPolygon3D(targetCtx, points, closed, h3d, strokeCol, fillLight) {
      if (!points || points.length === 0) return;
      const basePts = points.map(p => worldToScreen(p.x, p.y, 0));
      targetCtx.beginPath();
      targetCtx.moveTo(basePts[0].x, basePts[0].y);
      for (let i = 1; i < basePts.length; i++) targetCtx.lineTo(basePts[i].x, basePts[i].y);
      if (closed) targetCtx.closePath();
      if (fillLight) { targetCtx.fillStyle = strokeCol + '22'; targetCtx.fill(); }
      targetCtx.stroke();

      if (state.viewMode !== '2D' && h3d > 0) {
        const topPts = points.map(p => worldToScreen(p.x, p.y, h3d));
        if (state.viewMode === '3DSolid') {
          targetCtx.fillStyle = strokeCol + '38';
          targetCtx.beginPath();
          targetCtx.moveTo(topPts[0].x, topPts[0].y);
          for (let i = 1; i < topPts.length; i++) targetCtx.lineTo(topPts[i].x, topPts[i].y);
          if (closed) targetCtx.closePath();
          targetCtx.fill();
        }
        targetCtx.beginPath();
        targetCtx.moveTo(topPts[0].x, topPts[0].y);
        for (let i = 1; i < topPts.length; i++) targetCtx.lineTo(topPts[i].x, topPts[i].y);
        if (closed) targetCtx.closePath();
        for (let i = 0; i < basePts.length; i += Math.max(1, Math.floor(basePts.length / 8))) {
          targetCtx.moveTo(basePts[i].x, basePts[i].y);
          targetCtx.lineTo(topPts[i].x, topPts[i].y);
        }
        targetCtx.stroke();
      }
    }

    function drawRevCloud(targetCtx, points, strokeCol) {
      if (points.length < 2) return;
      targetCtx.strokeStyle = strokeCol;
      const sPts = points.map(p => worldToScreen(p.x, p.y, 0));
      targetCtx.beginPath();
      for (let i = 0; i < sPts.length; i++) {
        const p1 = sPts[i], p2 = sPts[(i + 1) % sPts.length];
        const midX = (p1.x + p2.x) / 2, midY = (p1.y + p2.y) / 2;
        const dx = p2.x - p1.x, dy = p2.y - p1.y;
        const r = Math.max(6, Math.hypot(dx, dy) / 2);
        const ang = Math.atan2(dy, dx);
        targetCtx.arc(midX, midY, r, ang + Math.PI, ang, false);
      }
      targetCtx.stroke();
    }

    function drawDimensionLinear(targetCtx, e, col) {
      const dx = e.x2 - e.x1, dy = e.y2 - e.y1;
      const len = Math.hypot(dx, dy);
      const nx = len > 0 ? -dy / len : 0, ny = len > 0 ? dx / len : 1;
      const off = e.offset || 28;
      const d1 = worldToScreen(e.x1 + nx * off, e.y1 + ny * off, 0);
      const d2 = worldToScreen(e.x2 + nx * off, e.y2 + ny * off, 0);
      const p1 = worldToScreen(e.x1, e.y1, 0), p2 = worldToScreen(e.x2, e.y2, 0);
      targetCtx.strokeStyle = col;
      targetCtx.beginPath();
      targetCtx.moveTo(p1.x, p1.y); targetCtx.lineTo(d1.x, d1.y);
      targetCtx.moveTo(p2.x, p2.y); targetCtx.lineTo(d2.x, d2.y);
      targetCtx.moveTo(d1.x, d1.y); targetCtx.lineTo(d2.x, d2.y);
      targetCtx.stroke();
      targetCtx.fillStyle = col;
      targetCtx.font = "bold 10px monospace";
      targetCtx.fillText(`${len.toFixed(1)}`, (d1.x + d2.x) / 2 - 14, (d1.y + d2.y) / 2 - 5);
    }

    function drawDimensionRadial(targetCtx, e, col) {
      const ang = e.angle || 0.6;
      const c = worldToScreen(e.cx, e.cy, 0);
      const rim = worldToScreen(e.cx + Math.cos(ang) * e.r, e.cy + Math.sin(ang) * e.r, 0);
      targetCtx.strokeStyle = col;
      targetCtx.beginPath(); targetCtx.moveTo(c.x, c.y); targetCtx.lineTo(rim.x, rim.y); targetCtx.stroke();
      targetCtx.fillStyle = col;
      targetCtx.font = "bold 10px monospace";
      targetCtx.fillText(`R${e.r.toFixed(1)}`, (c.x + rim.x) / 2 + 4, (c.y + rim.y) / 2 - 4);
    }

    function drawDimensionAngular(targetCtx, e, col) {
      const v = worldToScreen(e.cx, e.cy, 0);
      const p1 = worldToScreen(e.x1, e.y1, 0), p2 = worldToScreen(e.x2, e.y2, 0);
      targetCtx.strokeStyle = col;
      targetCtx.beginPath();
      targetCtx.moveTo(v.x, v.y); targetCtx.lineTo(p1.x, p1.y);
      targetCtx.moveTo(v.x, v.y); targetCtx.lineTo(p2.x, p2.y);
      targetCtx.stroke();
      targetCtx.fillStyle = col;
      targetCtx.font = "bold 10px monospace";
      targetCtx.fillText(`${(e.angleDeg || 45).toFixed(1)}°`, v.x + 12, v.y - 8);
    }

    function drawDimensionArcLen(targetCtx, e, col) {
      const c = worldToScreen(e.cx, e.cy, 0);
      targetCtx.strokeStyle = col;
      targetCtx.beginPath();
      targetCtx.arc(c.x, c.y, Math.max(2, (e.r + 16) * state.cam.zoom), -(e.endAngle || 1.5), -(e.startAngle || 0));
      targetCtx.stroke();
      targetCtx.fillStyle = col;
      targetCtx.font = "bold 10px monospace";
      targetCtx.fillText(`⌒ ${(e.arcLen || 120).toFixed(1)}`, c.x + 10, c.y - (e.r + 18) * state.cam.zoom);
    }

    function drawBlockRef(targetCtx, e, col) {
      const def = BLOCK_CATALOG.find(b => b.name === e.blockName) || BLOCK_CATALOG[0];
      const scale = e.scale || 1;
      for (const g of def.geom) {
        if (g.type === 'line') {
          const p1 = worldToScreen(e.x + g.x1 * scale, e.y + g.y1 * scale, 0);
          const p2 = worldToScreen(e.x + g.x2 * scale, e.y + g.y2 * scale, 0);
          targetCtx.beginPath(); targetCtx.moveTo(p1.x, p1.y); targetCtx.lineTo(p2.x, p2.y); targetCtx.stroke();
        } else if (g.type === 'circle') {
          const c = worldToScreen(e.x + g.cx * scale, e.y + g.cy * scale, 0);
          targetCtx.beginPath(); targetCtx.arc(c.x, c.y, Math.max(1, g.r * scale * state.cam.zoom), 0, Math.PI * 2); targetCtx.stroke();
        } else if (g.type === 'arc') {
          const c = worldToScreen(e.x + g.cx * scale, e.y + g.cy * scale, 0);
          targetCtx.beginPath(); targetCtx.arc(c.x, c.y, Math.max(1, g.r * scale * state.cam.zoom), -g.endAngle, -g.startAngle); targetCtx.stroke();
        } else if (g.type === 'rect') {
          const p1 = worldToScreen(e.x + g.x1 * scale, e.y + g.y1 * scale, 0);
          const p2 = worldToScreen(e.x + g.x2 * scale, e.y + g.y2 * scale, 0);
          targetCtx.strokeRect(Math.min(p1.x, p2.x), Math.min(p1.y, p2.y), Math.abs(p2.x - p1.x), Math.abs(p2.y - p1.y));
        } else if (g.type === 'polyline') {
          const pts = g.points.map(pt => worldToScreen(e.x + pt.x * scale, e.y + pt.y * scale, 0));
          targetCtx.beginPath(); targetCtx.moveTo(pts[0].x, pts[0].y);
          pts.slice(1).forEach(pt => targetCtx.lineTo(pt.x, pt.y));
          if (g.closed) targetCtx.closePath();
          targetCtx.stroke();
        }
      }
      const ins = worldToScreen(e.x, e.y, 0);
      const tag = e.attributes && e.attributes.TAG ? `[${e.attributes.TAG}]` : `[${e.blockName}]`;
      targetCtx.fillStyle = col;
      targetCtx.font = "bold 9px monospace";
      targetCtx.fillText(tag, ins.x - 14, ins.y + 15);
    }

    function drawRubberBandAndGhostPreview(targetCtx) {
      const cur = state.pointerWorld;
      const spCur = worldToScreen(cur.x, cur.y, 0);

      // Live ghost preview for Cross-Drawing Clipboard Paste!
      if (state.activeTool === 'clip_paste') {
        const clip = getCrossDrawingClipboard();
        if (clip && clip.entities && clip.entities.length > 0) {
          targetCtx.save();
          const dx = cur.x - clip.basePt.x, dy = cur.y - clip.basePt.y;
          for (const orig of clip.entities) {
            const clone = JSON.parse(JSON.stringify(orig));
            translateEntity(clone, dx, dy);
            renderSingleEntity(targetCtx, clone, '#10b981', false, true);
          }
          targetCtx.fillStyle = '#10b981';
          targetCtx.font = "bold 10px monospace";
          targetCtx.fillText(`📌 붙여넣기 (${clip.entities.length}개 객체)`, spCur.x + 10, spCur.y - 10);
          targetCtx.restore();
        }
        return;
      }

      const pts = state.tempPoints;
      if (pts.length === 0) return;
      const sp0 = worldToScreen(pts[0].x, pts[0].y, 0);

      targetCtx.save();
      targetCtx.strokeStyle = '#38bdf8';
      targetCtx.lineWidth = 1.8;
      targetCtx.setLineDash([6, 4]);

      if (state.activeTool === 'rotate') {
        targetCtx.fillStyle = '#f59e0b';
        targetCtx.beginPath(); targetCtx.arc(sp0.x, sp0.y, 4.5, 0, Math.PI * 2); targetCtx.fill();
        targetCtx.font = "bold 10px monospace";
        targetCtx.fillText('A(기준점)', sp0.x + 7, sp0.y - 7);

        if (pts.length === 1) {
          targetCtx.beginPath(); targetCtx.moveTo(sp0.x, sp0.y); targetCtx.lineTo(spCur.x, spCur.y); targetCtx.stroke();
          targetCtx.fillStyle = '#38bdf8';
          targetCtx.fillText('B(참조점)', spCur.x + 8, spCur.y + 12);
        } else if (pts.length === 2) {
          const spB = worldToScreen(pts[1].x, pts[1].y, 0);
          targetCtx.strokeStyle = '#fbbf24';
          targetCtx.beginPath(); targetCtx.moveTo(sp0.x, sp0.y); targetCtx.lineTo(spB.x, spB.y); targetCtx.stroke();
          targetCtx.fillStyle = '#fbbf24';
          targetCtx.fillText('B', spB.x + 6, spB.y - 5);

          targetCtx.strokeStyle = '#10b981';
          targetCtx.beginPath(); targetCtx.moveTo(sp0.x, sp0.y); targetCtx.lineTo(spCur.x, spCur.y); targetCtx.stroke();

          const angB = Math.atan2(pts[1].y - pts[0].y, pts[1].x - pts[0].x);
          const angC = Math.atan2(cur.y - pts[0].y, cur.x - pts[0].x);
          const deltaDeg = ((angC - angB) * 180) / Math.PI;
          targetCtx.fillStyle = '#10b981';
          targetCtx.fillText(`C (Δ=${deltaDeg.toFixed(2)}°)`, spCur.x + 8, spCur.y + 14);

          for (const e of state.entities) {
            if (!state.selectedIds.has(e.id)) continue;
            const clone = JSON.parse(JSON.stringify(e));
            rotateEntity(clone, pts[0].x, pts[0].y, deltaDeg);
            renderSingleEntity(targetCtx, clone, '#10b981', false, true);
          }
        }
        targetCtx.restore();
        return;
      }

      if (state.activeTool === 'scale') {
        targetCtx.fillStyle = '#f59e0b';
        targetCtx.beginPath(); targetCtx.arc(sp0.x, sp0.y, 4.5, 0, Math.PI * 2); targetCtx.fill();
        if (pts.length === 1) {
          targetCtx.beginPath(); targetCtx.moveTo(sp0.x, sp0.y); targetCtx.lineTo(spCur.x, spCur.y); targetCtx.stroke();
        } else if (pts.length === 2) {
          const refDist = Math.max(1e-3, Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y));
          const curDist = Math.max(1e-3, Math.hypot(cur.x - pts[0].x, cur.y - pts[0].y));
          const factor = curDist / refDist;
          targetCtx.strokeStyle = '#10b981';
          targetCtx.beginPath(); targetCtx.moveTo(sp0.x, sp0.y); targetCtx.lineTo(spCur.x, spCur.y); targetCtx.stroke();
          for (const e of state.entities) {
            if (!state.selectedIds.has(e.id)) continue;
            const clone = JSON.parse(JSON.stringify(e));
            scaleEntity(clone, pts[0].x, pts[0].y, factor);
            renderSingleEntity(targetCtx, clone, '#10b981', false, true);
          }
        }
        targetCtx.restore();
        return;
      }

      if ((state.activeTool === 'move' || state.activeTool === 'copy') && pts.length === 1) {
        targetCtx.beginPath(); targetCtx.moveTo(sp0.x, sp0.y); targetCtx.lineTo(spCur.x, spCur.y); targetCtx.stroke();
        const dx = cur.x - pts[0].x, dy = cur.y - pts[0].y;
        for (const e of state.entities) {
          if (!state.selectedIds.has(e.id)) continue;
          const clone = JSON.parse(JSON.stringify(e));
          translateEntity(clone, dx, dy);
          renderSingleEntity(targetCtx, clone, '#10b981', false, true);
        }
        targetCtx.restore();
        return;
      }

      if (state.activeTool === 'mirror' && pts.length === 1) {
        targetCtx.strokeStyle = '#f59e0b';
        targetCtx.beginPath(); targetCtx.moveTo(sp0.x, sp0.y); targetCtx.lineTo(spCur.x, spCur.y); targetCtx.stroke();
        for (const e of state.entities) {
          if (!state.selectedIds.has(e.id)) continue;
          const clone = mirrorEntityClone(e, pts[0].x, pts[0].y, cur.x, cur.y);
          renderSingleEntity(targetCtx, clone, '#10b981', false, true);
        }
        targetCtx.restore();
        return;
      }

      if (state.activeTool === 'line' || state.activeTool === 'meas_dist' || state.activeTool === 'dim_linear' || state.activeTool === 'dim_aligned') {
        const lastPt = worldToScreen(pts[pts.length - 1].x, pts[pts.length - 1].y, 0);
        targetCtx.beginPath(); targetCtx.moveTo(lastPt.x, lastPt.y); targetCtx.lineTo(spCur.x, spCur.y); targetCtx.stroke();
      } else if (state.activeTool === 'circle' || state.activeTool === 'dim_radial') {
        const r = Math.max(1, Math.hypot(cur.x - pts[0].x, cur.y - pts[0].y) * state.cam.zoom);
        targetCtx.beginPath(); targetCtx.arc(sp0.x, sp0.y, r, 0, Math.PI * 2); targetCtx.stroke();
      } else if (state.activeTool === 'rect' || state.activeTool === 'markup_rect' || state.activeTool === 'hatch') {
        targetCtx.strokeRect(Math.min(sp0.x, spCur.x), Math.min(sp0.y, spCur.y), Math.abs(spCur.x - sp0.x), Math.abs(spCur.y - sp0.y));
      } else if (state.activeTool === 'polyline' || state.activeTool === 'meas_area' || state.activeTool === 'revcloud' || state.activeTool === 'brush' || state.activeTool === 'smartpen') {
        targetCtx.beginPath();
        targetCtx.moveTo(sp0.x, sp0.y);
        for (let i = 1; i < pts.length; i++) {
          const p = worldToScreen(pts[i].x, pts[i].y, 0);
          targetCtx.lineTo(p.x, p.y);
        }
        targetCtx.lineTo(spCur.x, spCur.y);
        if (state.activeTool === 'meas_area') targetCtx.closePath();
        targetCtx.stroke();
      }
      targetCtx.restore();
    }

    function drawCanvas() {
      renderEntitiesToContext(ctx, canvas.width, canvas.height);
      if (state.loupeActive) updateMagnifierLoupe();
    }

    function updateMagnifierLoupe() {
      loupeCanvas.style.display = 'block';
      loupeCanvas.style.left = Math.max(8, Math.min(window.innerWidth - 128, state.pointerScreen.x - 60)) + 'px';
      loupeCanvas.style.top = Math.max(8, state.pointerScreen.y - 135) + 'px';

      const prevZoom = state.cam.zoom, prevX = state.cam.x, prevY = state.cam.y;
      state.cam.x = state.pointerWorld.x;
      state.cam.y = state.pointerWorld.y;
      state.cam.zoom = prevZoom * 2.8;

      loupeCtx.clearRect(0, 0, 120, 120);
      renderEntitiesToContext(loupeCtx, 120, 120);

      loupeCtx.strokeStyle = '#10b981';
      loupeCtx.lineWidth = 1.2;
      loupeCtx.beginPath();
      loupeCtx.moveTo(60, 0); loupeCtx.lineTo(60, 120);
      loupeCtx.moveTo(0, 60); loupeCtx.lineTo(120, 60);
      loupeCtx.stroke();

      state.cam.zoom = prevZoom; state.cam.x = prevX; state.cam.y = prevY;
    }

    function finishSmartPenStroke(points) {
      if (points.length < 3) return;
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const p of points) {
        if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
      }
      const startEndDist = Math.hypot(points[points.length - 1].x - points[0].x, points[points.length - 1].y - points[0].y);
      const diag = Math.hypot(maxX - minX, maxY - minY);
      if (diag < 5) return;

      pushHistory();
      if (startEndDist > diag * 0.65) {
        state.entities.push({
          id: genId(), type: 'line', space: state.space, layer: state.currentLayer, color: state.activeColor,
          linetype: state.activeLinetype, x1: points[0].x, y1: points[0].y, x2: points[points.length - 1].x, y2: points[points.length - 1].y, height3D: 30
        });
        showToast('SmartPen: 직선 자동 변환 완료');
      } else {
        const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
        const avgR = ((maxX - minX) + (maxY - minY)) / 4;
        let radialVar = 0;
        for (const p of points) radialVar += Math.abs(Math.hypot(p.x - cx, p.y - cy) - avgR);
        radialVar /= points.length;
        if (radialVar < avgR * 0.24) {
          state.entities.push({ id: genId(), type: 'circle', space: state.space, layer: state.currentLayer, color: state.activeColor, linetype: state.activeLinetype, cx, cy, r: Math.max(8, avgR), height3D: 40 });
          showToast('SmartPen: 원 자동 변환 완료');
        } else {
          state.entities.push({ id: genId(), type: 'rect', space: state.space, layer: state.currentLayer, color: state.activeColor, linetype: state.activeLinetype, x1: minX, y1: minY, x2: maxX, y2: maxY, height3D: 40 });
          showToast('SmartPen: 직사각형 자동 변환 완료');
        }
      }
      drawCanvas();
    }

    function setActiveTool(toolName) {
      if (state.viewMode !== '2D' && toolName !== 'select' && toolName !== 'pan') {
        showToast('3D 모드에서는 회전/확대만 가능합니다. 2D 보기로 전환하세요.');
        return;
      }
      if (toolName === 'deselect') {
        state.selectedIds.clear();
        state.tempPoints = [];
        state.tempTargetEntity = null;
        drawCanvas();
        showToast('선택 해제됨');
        return;
      }
      if (toolName === 'erase' && state.selectedIds.size > 0) {
        pushHistory();
        state.entities = state.entities.filter(e => !state.selectedIds.has(e.id));
        state.selectedIds.clear();
        drawCanvas();
        showToast('선택 객체 삭제 완료');
        return;
      }

      state.activeTool = toolName;
      state.tempPoints = [];
      state.tempTargetEntity = null;
      state.copiedProps = null;

      if (toolName === 'offset') document.getElementById('inputParam1').value = '25';
      else if (toolName === 'fillet') document.getElementById('inputParam1').value = '20';
      else if (toolName === 'chamfer') {
        document.getElementById('inputParam1').value = '20';
        document.getElementById('inputParam2').value = '20';
      }

      document.querySelectorAll('.sub-toolbar .cad-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.tool === toolName);
      });
      document.getElementById('btnPanModeFab').classList.toggle('active', toolName === 'pan');

      const info = TOOL_INFO[toolName] || TOOL_INFO.select;
      document.getElementById('activeToolBadge').textContent = info.badge;
      document.getElementById('statusPrompt').textContent = info.prompt;
      document.getElementById('labelParam1').textContent = info.p1 + ':';
      document.getElementById('labelParam2').textContent = info.p2 + ':';

      if (toolName === 'insert_block') openSideDrawer('blocks');
      else if (toolName === 'image_attach') document.getElementById('imageAttachInput').click();
      drawCanvas();
    }

    // Linetype Cycle Button
    document.getElementById('btnLinetypeCycle').addEventListener('click', () => {

      state.activeLinetype = LINETYPES[idx].id;
      document.getElementById('btnLinetypeCycle').textContent = LINETYPES[idx].label;

        pushHistory();

    // OSNAP Strip & Dialog

      const topBtn = document.getElementById('btnOsnapDialog');

      topBtn.classList.toggle('osnap-on', state.osnapEnabled);

      document.querySelectorAll('#osnapStrip .snap-chip[data-snap]').forEach(chip => {

      document.getElementById('btnOrthoToggle').classList.toggle('on', state.orthoEnabled);
      document.getElementById('btnPolarToggle').classList.toggle('on', state.polarEnabled);
      document.getElementById('btnGridToggle').classList.toggle('on', state.gridEnabled);

    document.getElementById('btnMasterOsnap').addEventListener('click', () => {

    const OSNAP_DESCRIPTIONS = [
      { key: 'END', sym: '□', name: '끝점 (Endpoint)', desc: '선, 폴리라인, 사각형, 호의 꼭짓점' },
      { key: 'MID', sym: '△', name: '중간점 (Midpoint)', desc: '선분 및 폴리라인 구간의 중앙' },
      { key: 'CEN', sym: '○', name: '중심점 (Center)', desc: '원(Circle) 및 호(Arc)의 중심' },

    document.getElementById('btnOsnapDialog').addEventListener('click', () => {

    // Zoom & Pan Floating Pad
    document.getElementById('btnZoomInFab').addEventListener('click', () => {

      updateZoomLabel();

    });
    document.getElementById('btnZoomOutFab').addEventListener('click', () => {

    document.getElementById('btnZoomFitFab').addEventListener('click', zoomExtents);
