    /*************************************************************************
     * AUTOCAD YEAR / VERSION SPECIFIC DXF & DWG GENERATOR
     * Supports AC1009 (R12) up to AC1032 (2018~2024)
     * Automatically converts LWPOLYLINE -> legacy POLYLINE+VERTEX+SEQEND when saving as R12 (AC1009)!
     *************************************************************************/
    function generateDXFString(acadVer = state.acadVersion) {
      const isR12 = acadVer === 'AC1009';
      const lines = [
        '0', 'SECTION',
        '2', 'HEADER',
        '9', '$ACADVER',
        '1', acadVer,
        '9', '$INSUNITS',
        '70', '4',
        '0', 'ENDSEC',
        '0', 'SECTION',
        '2', 'TABLES',
        '0', 'TABLE',
        '2', 'LAYER'
      ];
      state.layers.forEach(l => {
        lines.push('0', 'LAYER', '2', l.name, '70', '0', '62', '7', '6', 'CONTINUOUS');
      });
      lines.push('0', 'ENDTAB', '0', 'ENDSEC', '0', 'SECTION', '2', 'ENTITIES');

      for (const e of state.entities) {
        const lay = e.layer || '0';
        const ltype = e.linetype || 'CONTINUOUS';
        if (e.type === 'line' || e.type === 'dim_linear' || e.type === 'dim_aligned') {
          lines.push('0', 'LINE', '8', lay, '6', ltype, '10', e.x1.toFixed(4), '20', e.y1.toFixed(4), '30', '0.0', '11', e.x2.toFixed(4), '21', e.y2.toFixed(4), '31', '0.0');
        } else if (e.type === 'circle' || e.type === 'dim_radial') {
          lines.push('0', 'CIRCLE', '8', lay, '6', ltype, '10', e.cx.toFixed(4), '20', e.cy.toFixed(4), '30', '0.0', '40', e.r.toFixed(4));
        } else if (e.type === 'arc') {
          const sa = ((e.startAngle || 0) * 180) / Math.PI, ea = ((e.endAngle || Math.PI) * 180) / Math.PI;
          lines.push('0', 'ARC', '8', lay, '6', ltype, '10', e.cx.toFixed(4), '20', e.cy.toFixed(4), '30', '0.0', '40', e.r.toFixed(4), '50', sa.toFixed(4), '51', ea.toFixed(4));
        } else if (e.type === 'point_node') {
          lines.push('0', 'POINT', '8', lay, '10', e.x.toFixed(4), '20', e.y.toFixed(4), '30', '0.0');
        } else if (e.type === 'rect' || e.type === 'markup_rect' || e.type === 'hatch') {
          const rPts = [{ x: e.x1, y: e.y1 }, { x: e.x2, y: e.y1 }, { x: e.x2, y: e.y2 }, { x: e.x1, y: e.y2 }];
          if (isR12) {
            lines.push('0', 'POLYLINE', '8', lay, '66', '1', '70', '1');
            rPts.forEach(p => lines.push('0', 'VERTEX', '8', lay, '10', p.x.toFixed(4), '20', p.y.toFixed(4), '30', '0.0'));
            lines.push('0', 'SEQEND');
          } else {
            lines.push('0', 'LWPOLYLINE', '8', lay, '90', '4', '70', '1');
            rPts.forEach(p => lines.push('10', p.x.toFixed(4), '20', p.y.toFixed(4)));
          }
        } else if (e.type === 'polyline' || e.type === 'revcloud' || e.type === 'brush') {
          const pts = e.points || [];
          if (pts.length > 0) {
            if (isR12) {
              lines.push('0', 'POLYLINE', '8', lay, '66', '1', '70', e.closed ? '1' : '0');
              pts.forEach(p => lines.push('0', 'VERTEX', '8', lay, '10', p.x.toFixed(4), '20', p.y.toFixed(4), '30', '0.0'));
              lines.push('0', 'SEQEND');
            } else {
              lines.push('0', 'LWPOLYLINE', '8', lay, '90', String(pts.length), '70', e.closed ? '1' : '0');
              pts.forEach(p => lines.push('10', p.x.toFixed(4), '20', p.y.toFixed(4)));
            }
          }
        } else if (e.type === 'text' || e.type === 'markup_text' || e.type === 'voice_note' || e.type === 'field_pin') {
          lines.push('0', 'TEXT', '8', lay, '10', (e.x || 0).toFixed(4), '20', (e.y || 0).toFixed(4), '30', '0.0', '40', String(e.fontSize || 16), '1', e.text || e.title || e.label || 'TEXT');
        }
      }
      lines.push('0', 'ENDSEC', '0', 'EOF');
      return lines.join('\r\n');
    }

    function generateDWGContainerString(acadVer = state.acadVersion) {
      const verInfo = AUTOCAD_VERSIONS.find(v => v.code === acadVer) || AUTOCAD_VERSIONS[0];
      return `${acadVer}_YCAD_HYBRID_DWG\n` + JSON.stringify({
        dwgVersionHeader: acadVer,
        autocadRelease: verInfo.label,
        fileName: state.fileName,
        layers: state.layers,
        entities: state.entities.map(e => ({ ...e, imgObj: undefined })),
        dxfMirror: generateDXFString(acadVer)
      }, null, 2);
    }

    /*************************************************************************
     * KOREAN CHARSET DECODER (UTF-8 / CP949 / EUC-KR / \U+XXXX / \M+5XXXX)
     * & FULL DXF + BINARY DWG (BLOCKS + INSERT + LWPOLYLINE + SPLINE + MTEXT) PARSER
     *************************************************************************/
    state.preferredEncoding = 'AUTO'; // 'AUTO' | 'EUC-KR' | 'UTF-8'
    state.lastRawBuffer = null;

    const ACI_PALETTE = {
      1: '#ff3b30', 2: '#fde047', 3: '#22c55e', 4: '#00e5ff',
      5: '#3b82f6', 6: '#e879f9', 7: '#ffffff', 8: '#94a3b8', 9: '#cbd5e1'
    };

    function aciToHex(aci) {
      const n = Math.abs(parseInt(aci, 10) || 7);
      if (ACI_PALETTE[n]) return ACI_PALETTE[n];
      if (n >= 10 && n < 50) return '#fb923c';
      if (n >= 50 && n < 110) return '#4ade80';
      if (n >= 110 && n < 190) return '#38bdf8';
      if (n >= 190 && n < 250) return '#c084fc';
      return '#e2e8f0';
    }

    // Cleans AutoCAD Unicode escapes (\U+AC00), Korean MIF (\M+5xxxx), and MTEXT formatting codes ({\fGulim|...;텍스트}, \P, \A1;)
    function cleanCADTextString(rawStr) {
      if (!rawStr) return '';
      let s = String(rawStr);

      // 1. Decode \U+XXXX hex unicode escapes (e.g. \U+B3C4\U+BA74 -> 도면)
      s = s.replace(/\\[Uu]\+([0-9A-Fa-f]{4})/g, (_, hex) => String.fromCharCode(parseInt(hex, 16)));

      // 2. Decode AutoCAD Korean MIF \M+5XXXX (KS X 1001 / CP949 2-byte hex) using EUC-KR TextDecoder
      s = s.replace(/\\[Mm]\+[1-5]([0-9A-Fa-f]{4})/g, (_, hex) => {
        try {
          const b1 = parseInt(hex.substring(0, 2), 16);
          const b2 = parseInt(hex.substring(2, 4), 16);
          return new TextDecoder('euc-kr').decode(new Uint8Array([b1, b2]));
        } catch (e) {
          return '';
        }
      });

      // 3. Convert AutoCAD special symbols (%%c -> Ø, %%d -> °, %%p -> ±)
      s = s.replace(/%%[cC]/g, 'Ø').replace(/%%[dD]/g, '°').replace(/%%[pP]/g, '±').replace(/%%[uU]/g, '');

      // 4. Strip MTEXT formatting codes: \P -> space, {\f...;text} -> text, \A1;, \H...;, \W...;, \C...;, \Q...;, \T...;
      s = s.replace(/\\P/g, ' ')
           .replace(/\\[fF][^;]*;/g, '')
           .replace(/\\[A-Za-z][^;]*;/g, '')
           .replace(/\\[LOKlok]/g, '')
           .replace(/[{}]/g, '');

      return s.trim();
    }

    // Automatically detects whether an ArrayBuffer is UTF-8, UTF-16LE, or Korean CP949 / EUC-KR!
    function decodeArrayBufferAutoCharset(buffer, forceMode = state.preferredEncoding) {
      const bytes = new Uint8Array(buffer);
      if (bytes.length >= 2 && bytes[0] === 0xFF && bytes[1] === 0xFE) {
        return { text: new TextDecoder('utf-16le').decode(bytes), encoding: 'UTF-16LE' };
      }
      if (forceMode === 'EUC-KR') {
        try {
          return { text: new TextDecoder('euc-kr').decode(bytes), encoding: 'CP949(EUC-KR)' };
        } catch (e) {}
      }
      if (forceMode === 'UTF-8') {
        return { text: new TextDecoder('utf-8').decode(bytes), encoding: 'UTF-8' };
      }

      // AUTO mode: Try strict UTF-8 first; if invalid UTF-8 byte sequences exist (which happens on every CP949/EUC-KR Korean CAD file!), decode as EUC-KR (CP949)
      try {
        const strictUtf8 = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
        return { text: strictUtf8, encoding: 'UTF-8' };
      } catch (utf8Err) {
        try {
          const euckrText = new TextDecoder('euc-kr').decode(bytes);
          return { text: euckrText, encoding: 'CP949(한글완성형)' };
        } catch (e2) {
          return { text: new TextDecoder('utf-8').decode(bytes), encoding: 'UTF-8' };
        }
      }
    }

    document.getElementById('btnEncodingToggle').addEventListener('click', () => {
      const modes = ['AUTO', 'EUC-KR', 'UTF-8'];
      const nextIdx = (modes.indexOf(state.preferredEncoding) + 1) % modes.length;
      state.preferredEncoding = modes[nextIdx];
      const labels = { 'AUTO': '한글:자동(CP949)', 'EUC-KR': '한글:CP949강제', 'UTF-8': '한글:UTF-8강제' };
      document.getElementById('btnEncodingToggle').textContent = labels[state.preferredEncoding];
      if (state.lastRawBuffer) {
        processLoadedFileBuffer(state.lastRawBuffer, state.fileName);
      } else {
        showToast(`인코딩 모드 변경: ${labels[state.preferredEncoding]}`);
      }
    });

    // Helper: Convert LWPOLYLINE bulge segment into intermediate arc points
    function expandBulgePoints(p1, p2, bulge) {
      if (!bulge || Math.abs(bulge) < 1e-4) return [p1];
      const chordDx = p2.x - p1.x, chordDy = p2.y - p1.y;
      const chordLen = Math.hypot(chordDx, chordDy);
      if (chordLen < 1e-5) return [p1];
      const theta = 4 * Math.atan(bulge);
      const radius = Math.abs(chordLen / (2 * Math.sin(theta / 2)));
      const midX = (p1.x + p2.x) / 2, midY = (p1.y + p2.y) / 2;
      const d = Math.sqrt(Math.max(0, radius * radius - (chordLen * chordLen) / 4));
      const nx = -chordDy / chordLen, ny = chordDx / chordLen;
      const sign = (bulge > 0 ? 1 : -1) * (Math.abs(bulge) > 1 ? -1 : 1);
      const cx = midX + nx * d * sign, cy = midY + ny * d * sign;
      const startAng = Math.atan2(p1.y - cy, p1.x - cx);
      const steps = Math.max(4, Math.min(18, Math.ceil(Math.abs(theta) / 0.2)));
      const pts = [];
      for (let i = 0; i < steps; i++) {
        const a = startAng + (theta * i) / steps;
        pts.push({ x: cx + Math.cos(a) * radius, y: cy + Math.sin(a) * radius });
      }
      return pts;
    }

    // Parse a list of DXF group-code pairs inside either BLOCKS or ENTITIES
    function parseEntitySectionPairs(pairs, startIdx, endIdx, layerColors) {
      const entities = [];
      let idx = startIdx;

      while (idx < endIdx) {
        if (pairs[idx].code !== 0) { idx++; continue; }
        const entType = pairs[idx].val.toUpperCase();
        idx++;

        if (entType === 'ENDSEC' || entType === 'ENDBLK' || entType === 'EOF') break;

        // Handle legacy POLYLINE + VERTEX + SEQEND sequence
        if (entType === 'POLYLINE') {
          let layer = '0', color = null, flag = 0;
          while (idx < endIdx && pairs[idx].code !== 0) {
            if (pairs[idx].code === 8) layer = pairs[idx].val;
            else if (pairs[idx].code === 62) color = aciToHex(pairs[idx].val);
            else if (pairs[idx].code === 70) flag = parseInt(pairs[idx].val, 10) || 0;
            idx++;
          }
          const vPts = [];
          while (idx < endIdx) {
            if (pairs[idx].code === 0) {
              const subType = pairs[idx].val.toUpperCase();
              idx++;
              if (subType === 'VERTEX') {
                let vx = null, vy = null, vFlag = 0;
                while (idx < endIdx && pairs[idx].code !== 0) {
                  if (pairs[idx].code === 10) vx = parseFloat(pairs[idx].val);
                  else if (pairs[idx].code === 20) vy = parseFloat(pairs[idx].val);
                  else if (pairs[idx].code === 70) vFlag = parseInt(pairs[idx].val, 10) || 0;
                  idx++;
                }
                if (vx !== null && vy !== null && (vFlag & 16) === 0) {
                  vPts.push({ x: vx, y: vy });
                }
              } else if (subType === 'SEQEND') {
                while (idx < endIdx && pairs[idx].code !== 0) idx++;
                break;
              } else {
                idx--;
                break;
              }
            } else idx++;
          }
          if (vPts.length >= 2) {
            entities.push({
              id: genId(), type: 'polyline', space: 'Model', layer,
              color: color || layerColors[layer] || '#ffffff',
              closed: (flag & 1) === 1, points: vPts, height3D: 35
            });
          }
          continue;
        }

        // Standard entity properties collection
        const props = {
          layer: '0', linetype: 'CONTINUOUS', color: null,
          pts10: [], pts20: [], bulges: [],
          textParts: [], flag: 0, sx: 1, sy: 1, rotDeg: 0
        };

        while (idx < endIdx && pairs[idx].code !== 0) {
          const { code, val } = pairs[idx];
          if (code === 8) props.layer = cleanCADTextString(val) || '0';
          else if (code === 6) props.linetype = val.toUpperCase();
          else if (code === 62) props.color = aciToHex(val);
          else if (code === 1) props.textMain = val;
          else if (code === 3) props.textParts.push(val);
          else if (code === 2) props.blockName = cleanCADTextString(val);
          else if (code === 10) props.pts10.push(parseFloat(val));
          else if (code === 20) props.pts20.push(parseFloat(val));
          else if (code === 11) props.x2 = parseFloat(val);
          else if (code === 21) props.y2 = parseFloat(val);
          else if (code === 12) props.x3 = parseFloat(val);
          else if (code === 22) props.y3 = parseFloat(val);
          else if (code === 13) props.x4 = parseFloat(val);
          else if (code === 23) props.y4 = parseFloat(val);
          else if (code === 40) props.r = parseFloat(val);
          else if (code === 41) props.sx = parseFloat(val) || 1;
          else if (code === 42) {
            const bVal = parseFloat(val) || 0;
            if (entType === 'INSERT') props.sy = bVal || 1;
            else if (entType === 'LWPOLYLINE' && props.pts10.length > 0) {
              props.bulges[props.pts10.length - 1] = bVal;
            }
          }
          else if (code === 50) props.ang50 = parseFloat(val) || 0;
          else if (code === 51) props.ang51 = parseFloat(val) || 0;
          else if (code === 70) props.flag = parseInt(val, 10) || 0;
          else if (code === 67 && parseInt(val, 10) === 1) props.isPaperSpace = true;
          idx++;
        }

        const layer = props.layer || '0';
        const col = props.color || layerColors[layer] || '#00e5ff';
        const space = props.isPaperSpace ? 'Layout1' : 'Model';
        const x1 = props.pts10[0], y1 = props.pts20[0];

        if (entType === 'LINE' && Number.isFinite(x1) && Number.isFinite(props.x2)) {
          entities.push({
            id: genId(), type: 'line', space, layer, color: col, linetype: props.linetype,
            x1, y1: y1 || 0, x2: props.x2, y2: props.y2 || 0, height3D: 30
          });
        } else if (entType === 'CIRCLE' && Number.isFinite(x1) && Number.isFinite(props.r)) {
          entities.push({
            id: genId(), type: 'circle', space, layer, color: col, linetype: props.linetype,
            cx: x1, cy: y1 || 0, r: Math.abs(props.r), height3D: 30
          });
        } else if (entType === 'ARC' && Number.isFinite(x1) && Number.isFinite(props.r)) {
          entities.push({
            id: genId(), type: 'arc', space, layer, color: col, linetype: props.linetype,
            cx: x1, cy: y1 || 0, r: Math.abs(props.r),
            startAngle: ((props.ang50 || 0) * Math.PI) / 180,
            endAngle: ((props.ang51 || 180) * Math.PI) / 180,
            height3D: 30
          });
        } else if (entType === 'ELLIPSE' && Number.isFinite(x1) && Number.isFinite(props.x2)) {
          const majorR = Math.hypot(props.x2, props.y2 || 0);
          const ratio = props.r || 0.6;
          const pts = [];
          const baseAng = Math.atan2(props.y2 || 0, props.x2);
          for (let i = 0; i <= 28; i++) {
            const t = (i / 28) * Math.PI * 2;
            const ex = majorR * Math.cos(t), ey = majorR * ratio * Math.sin(t);
            pts.push({
              x: x1 + ex * Math.cos(baseAng) - ey * Math.sin(baseAng),
              y: (y1 || 0) + ex * Math.sin(baseAng) + ey * Math.cos(baseAng)
            });
          }
          entities.push({ id: genId(), type: 'polyline', space, layer, color: col, closed: true, points: pts, height3D: 25 });
        } else if ((entType === 'LWPOLYLINE' || entType === 'SPLINE' || entType === 'LEADER') && props.pts10.length >= 2) {
          const count = Math.min(props.pts10.length, props.pts20.length);
          const rawPts = [];
          for (let i = 0; i < count; i++) {
            if (Number.isFinite(props.pts10[i]) && Number.isFinite(props.pts20[i])) {
              rawPts.push({ x: props.pts10[i], y: props.pts20[i], bulge: props.bulges[i] || 0 });
            }
          }
          const finalPts = [];
          const isClosed = (props.flag & 1) === 1;
          for (let i = 0; i < rawPts.length; i++) {
            const pA = rawPts[i];
            const pB = rawPts[(i + 1) % rawPts.length];
            if ((i < rawPts.length - 1 || isClosed) && Math.abs(pA.bulge) > 1e-4) {
              finalPts.push(...expandBulgePoints(pA, pB, pA.bulge));
            } else {
              finalPts.push({ x: pA.x, y: pA.y });
            }
          }
          if (finalPts.length >= 2) {
            entities.push({
              id: genId(), type: 'polyline', space, layer, color: col, linetype: props.linetype,
              closed: isClosed, points: finalPts, height3D: 35
            });
          }
        } else if ((entType === 'SOLID' || entType === '3DFACE' || entType === 'TRACE') && Number.isFinite(x1) && Number.isFinite(props.x2)) {
          const pts = [{ x: x1, y: y1 || 0 }, { x: props.x2, y: props.y2 || 0 }];
          if (Number.isFinite(props.x4)) pts.push({ x: props.x4, y: props.y4 || 0 });
          if (Number.isFinite(props.x3)) pts.push({ x: props.x3, y: props.y3 || 0 });
          entities.push({ id: genId(), type: 'polyline', space, layer, color: col, closed: true, points: pts, height3D: 15 });
        } else if (entType === 'POINT' && Number.isFinite(x1)) {
          entities.push({ id: genId(), type: 'point_node', space, layer, color: col, x: x1, y: y1 || 0 });
        } else if ((entType === 'TEXT' || entType === 'MTEXT' || entType === 'ATTRIB' || entType === 'ATTDEF') && Number.isFinite(x1)) {
          const rawCombined = (props.textParts.join('') + (props.textMain || '')).trim();
          const cleaned = cleanCADTextString(rawCombined);
          if (cleaned) {
            entities.push({
              id: genId(), type: 'text', space, layer, color: col,
              x: x1, y: y1 || 0, text: cleaned, fontSize: Math.max(2, props.r || 14), height3D: 10
            });
          }
        } else if (entType === 'DIMENSION' && Number.isFinite(x1)) {
          const dx2 = Number.isFinite(props.x3) ? props.x3 : (Number.isFinite(props.x2) ? props.x2 : x1 + 50);
          const dy2 = Number.isFinite(props.y3) ? props.y3 : (Number.isFinite(props.y2) ? props.y2 : y1);
          const dimX1 = Number.isFinite(props.x4) ? props.x4 : x1;
          const dimY1 = Number.isFinite(props.y4) ? props.y4 : (y1 || 0);
          entities.push({
            id: genId(), type: 'dim_aligned', space, layer, color: '#fbbf24',
            x1: dimX1, y1: dimY1, x2: dx2, y2: dy2, offset: 15
          });
        } else if (entType === 'INSERT' && Number.isFinite(x1) && props.blockName) {
          entities.push({
            id: genId(), type: 'dxf_insert', space, layer, color: col,
            blockName: props.blockName, x: x1, y: y1 || 0,
            sx: props.sx || 1, sy: props.sy || (props.sx || 1),
            rotDeg: props.ang50 || 0
          });
        }
      }
      return entities;
    }

    // Transform an entity from a BLOCK definition into Model space via INSERT (x, y, sx, sy, rotDeg, basePt)
    function transformBlockSubEntity(sub, ins, basePt, parentLayer, parentColor) {
      const e = JSON.parse(JSON.stringify(sub));
      e.id = genId();
      e.space = ins.space || 'Model';
      if (!e.layer || e.layer === '0') e.layer = parentLayer;
      if (!e.color) e.color = parentColor;

      const rad = ((ins.rotDeg || 0) * Math.PI) / 180;
      const cos = Math.cos(rad), sin = Math.sin(rad);
      const sx = ins.sx || 1, sy = ins.sy || 1;

      function txPt(px, py) {
        const lx = (px - basePt.x) * sx;
        const ly = (py - basePt.y) * sy;
        return {
          x: ins.x + (lx * cos - ly * sin),
          y: ins.y + (lx * sin + ly * cos)
        };
      }

      if (e.x1 !== undefined) {
        const p1 = txPt(e.x1, e.y1), p2 = txPt(e.x2, e.y2);
        e.x1 = p1.x; e.y1 = p1.y; e.x2 = p2.x; e.y2 = p2.y;
      }
      if (e.cx !== undefined) {
        const c = txPt(e.cx, e.cy);
        e.cx = c.x; e.cy = c.y;
        e.r = (e.r || 10) * Math.max(Math.abs(sx), Math.abs(sy));
        if (e.startAngle !== undefined) { e.startAngle += rad; e.endAngle += rad; }
      }
      if (e.x !== undefined) {
        const p = txPt(e.x, e.y);
        e.x = p.x; e.y = p.y;
        if (e.fontSize) e.fontSize *= Math.max(Math.abs(sx), Math.abs(sy));
      }
      if (e.points) {
        e.points = e.points.map(p => txPt(p.x, p.y));
      }
      return e;
    }

    function parseDXFContent(text) {
      const rawLines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
      const pairs = [];
      for (let i = 0; i + 1 < rawLines.length; i += 2) {
        const codeStr = rawLines[i].trim();
        if (codeStr === '') continue;
        const code = parseInt(codeStr, 10);
        const val = rawLines[i + 1].trim();
        if (!isNaN(code)) pairs.push({ code, val });
      }

      let detectedVer = 'AC1032';
      const layerColors = { '0': '#00e5ff' };
      const blockDefs = {}; // blockName -> { basePt: {x,y}, entities: [] }
      let rawModelEntities = [];

      // Partition by SECTION (HEADER, TABLES, BLOCKS, ENTITIES)
      let i = 0;
      let foundSections = false;
      while (i < pairs.length) {
        if (pairs[i].code === 0 && pairs[i].val.toUpperCase() === 'SECTION') {
          foundSections = true;
          i++;
          let secName = '';
          if (i < pairs.length && pairs[i].code === 2) {
            secName = pairs[i].val.toUpperCase();
            i++;
          }
          const secStart = i;
          while (i < pairs.length && !(pairs[i].code === 0 && pairs[i].val.toUpperCase() === 'ENDSEC')) {
            i++;
          }
          const secEnd = i;

          if (secName === 'HEADER') {
            for (let k = secStart; k + 1 < secEnd; k++) {
              if (pairs[k].code === 9 && pairs[k].val === '$ACADVER') {
                detectedVer = pairs[k + 1].val || 'AC1032';
              }
            }
          } else if (secName === 'TABLES') {
            let k = secStart;
            while (k < secEnd) {
              if (pairs[k].code === 0 && pairs[k].val.toUpperCase() === 'LAYER') {
                k++;
                let lName = '0', lCol = '#00e5ff';
                while (k < secEnd && pairs[k].code !== 0) {
                  if (pairs[k].code === 2) lName = cleanCADTextString(pairs[k].val) || '0';
                  else if (pairs[k].code === 62) lCol = aciToHex(pairs[k].val);
                  k++;
                }
                layerColors[lName] = lCol;
              } else k++;
            }
          } else if (secName === 'BLOCKS') {
            let k = secStart;
            while (k < secEnd) {
              if (pairs[k].code === 0 && pairs[k].val.toUpperCase() === 'BLOCK') {
                k++;
                let bName = '', bx = 0, by = 0;
                while (k < secEnd && pairs[k].code !== 0) {
                  if (pairs[k].code === 2 || pairs[k].code === 3) bName = cleanCADTextString(pairs[k].val) || bName;
                  else if (pairs[k].code === 10) bx = parseFloat(pairs[k].val) || 0;
                  else if (pairs[k].code === 20) by = parseFloat(pairs[k].val) || 0;
                  k++;
                }
                const blkStart = k;
                while (k < secEnd && !(pairs[k].code === 0 && pairs[k].val.toUpperCase() === 'ENDBLK')) {
                  k++;
                }
                const blkEnd = k;
                if (bName) {
                  blockDefs[bName] = {
                    basePt: { x: bx, y: by },
                    entities: parseEntitySectionPairs(pairs, blkStart, blkEnd, layerColors)
                  };
                }
              } else k++;
            }
          } else if (secName === 'ENTITIES') {
            rawModelEntities = parseEntitySectionPairs(pairs, secStart, secEnd, layerColors);
          }
        } else {
          i++;
        }
      }

      // If a minimalist DXF file omitted SECTION wrappers, parse the whole pair list
      if (!foundSections) {
        rawModelEntities = parseEntitySectionPairs(pairs, 0, pairs.length, layerColors);
      }

      // Recursively expand INSERT (Block References) up to depth 3 so all block geometry is visible & editable!
      function expandEntities(entList, depth = 0) {
        const out = [];
        for (const e of entList) {
          if (e.type === 'dxf_insert' && depth < 3) {
            const def = blockDefs[e.blockName];
            if (def && def.entities && def.entities.length > 0) {
              const transformed = def.entities.map(sub => transformBlockSubEntity(sub, e, def.basePt, e.layer, e.color));
              out.push(...expandEntities(transformed, depth + 1));
            } else if (! e.blockName.startsWith('*')) {
              // Fallback placeholder if external XREF block was not embedded
              out.push({
                id: genId(), type: 'block_ref', space: e.space, layer: e.layer, color: e.color,
                blockName: 'DOOR-900', x: e.x, y: e.y, scale: Math.abs(e.sx || 1), rotation: e.rotDeg || 0,
                attributes: { TAG: e.blockName }
              });
            }
          } else if (e.type !== 'dxf_insert') {
            out.push(e);
          }
        }
        return out;
      }

      const finalEntities = expandEntities(rawModelEntities, 0);
      const layerList = Object.entries(layerColors).map(([name, color]) => ({ name, color, visible: true }));
      return { parsedEntities: finalEntities, layerList, detectedVer };
    }

    // Binary DWG Parser: Uses @mlightcad/libredwg-web WASM when loaded, plus native Korean CP949/UTF-16LE binary text & geometry stream extractor
    async function parseBinaryDWGArrayBuffer(buffer, fileName) {
      const bytes = new Uint8Array(buffer);
      const headerSig = new TextDecoder('ascii').decode(bytes.slice(0, 6));

      // 1. Check if it is a YCAD Hybrid DWG or ASCII DXF saved with a .dwg extension
      const firstLine = new TextDecoder('ascii').decode(bytes.slice(0, 48));
      if (firstLine.includes('_YCAD_HYBRID_DWG')) {
        const { text } = decodeArrayBufferAutoCharset(buffer);
        const data = JSON.parse(text.substring(text.indexOf('\n') + 1));
        state.acadVersion = data.dwgVersionHeader || 'AC1032';
        state.layers = data.layers || state.layers;
        state.entities = data.entities || [];
        return { count: state.entities.length, encoding: 'YCAD-DWG', ver: state.acadVersion };
      }
      if (firstLine.includes('SECTION') || firstLine.includes('0\n') || firstLine.includes('0\r\n')) {
        const { text, encoding } = decodeArrayBufferAutoCharset(buffer);
        const { parsedEntities, layerList, detectedVer } = parseDXFContent(text);
        if (parsedEntities.length > 0) {
          state.acadVersion = detectedVer;
          state.entities = parsedEntities;
          layerList.forEach(l => {
            if (!state.layers.some(ex => ex.name === l.name)) state.layers.push(l);
          });
          return { count: parsedEntities.length, encoding, ver: detectedVer };
        }
      }

      // 2. Try LibreDWG WebAssembly if loaded in window
      if (window.LibreDwgWeb && typeof window.LibreDwgWeb.LibreDwg?.create === 'function') {
        try {
          const libredwg = await window.LibreDwgWeb.LibreDwg.create();
          const dwgDataPtr = libredwg.dwg_read_data(buffer, window.LibreDwgWeb.Dwg_File_Type.DWG);
          const db = libredwg.convert(dwgDataPtr);
          libredwg.dwg_free(dwgDataPtr);
          if (db && db.entities && db.entities.length > 0) {
            const converted = [];
            for (const ent of db.entities) {
              const lay = cleanCADTextString(ent.layer || '0');
              if (ent.type === 'LINE' && ent.startPoint && ent.endPoint) {
                converted.push({ id: genId(), type: 'line', space: 'Model', layer: lay, color: '#00e5ff', x1: ent.startPoint.x, y1: ent.startPoint.y, x2: ent.endPoint.x, y2: ent.endPoint.y, height3D: 30 });
              } else if (ent.type === 'CIRCLE' && ent.center) {
                converted.push({ id: genId(), type: 'circle', space: 'Model', layer: lay, color: '#ffffff', cx: ent.center.x, cy: ent.center.y, r: ent.radius || 10, height3D: 30 });
              } else if (ent.type === 'ARC' && ent.center) {
                converted.push({ id: genId(), type: 'arc', space: 'Model', layer: lay, color: '#38bdf8', cx: ent.center.x, cy: ent.center.y, r: ent.radius || 10, startAngle: ent.startAngle || 0, endAngle: ent.endAngle || Math.PI, height3D: 30 });
              } else if ((ent.type === 'LWPOLYLINE' || ent.type === 'POLYLINE') && ent.vertices && ent.vertices.length > 1) {
                converted.push({ id: genId(), type: 'polyline', space: 'Model', layer: lay, color: '#ffffff', closed: !!ent.shape, points: ent.vertices.map(v => ({ x: v.x, y: v.y })), height3D: 35 });
              } else if ((ent.type === 'TEXT' || ent.type === 'MTEXT') && (ent.startPoint || ent.insertionPoint)) {
                const pt = ent.startPoint || ent.insertionPoint;
                converted.push({ id: genId(), type: 'text', space: 'Model', layer: lay, color: '#fbbf24', x: pt.x, y: pt.y, text: cleanCADTextString(ent.text || ''), fontSize: ent.textHeight || 16, height3D: 10 });
              }
            }
            if (converted.length > 0) {
              state.acadVersion = /^AC10\d\d$/.test(headerSig) ? headerSig : 'AC1032';
              state.entities = converted;
              return { count: converted.length, encoding: 'LibreDWG-WASM (UTF-8/CP949)', ver: state.acadVersion };
            }
          }
        } catch (wasmErr) {
          console.warn('LibreDWG WASM fallback:', wasmErr);
        }
      }

      // 3. Offline Binary DWG Korean Text (CP949 & UTF-16LE) + Geometry Scanner
      // AC1021+ (AutoCAD 2007~2024) stores strings in UTF-16LE; AC1014/AC1015/AC1018 (R14~2006) stores Korean strings in CP949 (EUC-KR)!
      const isUTF16Dwg = ['AC1021', 'AC1024', 'AC1027', 'AC1032'].includes(headerSig);
      const extractedTexts = [];
      const seenTexts = new Set();

      // Scan UTF-16LE Hangul / ASCII strings (for AutoCAD 2007~2024 DWG)
      for (let i = 0; i + 8 < bytes.length; i += 2) {
        let chars = [];
        let j = i;
        while (j + 1 < bytes.length && chars.length < 40) {
          const code = bytes[j] | (bytes[j + 1] << 8);
          const isHangul = (code >= 0xAC00 && code <= 0xD7A3) || (code >= 0x3131 && code <= 0x318E);
          const isAscii = (code >= 0x20 && code <= 0x7E);
          if (isHangul || isAscii) {
            chars.push(String.fromCharCode(code));
            j += 2;
          } else break;
        }
        if (chars.length >= 2) {
          const str = cleanCADTextString(chars.join(''));
          if (/[가-힣]/.test(str) && !seenTexts.has(str)) {
            seenTexts.add(str);
            extractedTexts.push(str);
            i = j;
          }
        }
      }

      // Scan CP949 / EUC-KR Korean strings (for AutoCAD R14/2000/2004 DWG or forced CP949)
      if (extractedTexts.length < 3 || state.preferredEncoding === 'EUC-KR' || !isUTF16Dwg) {
        try {
          const euckrDecoder = new TextDecoder('euc-kr');
          let i = 0;
          while (i + 4 < bytes.length) {
            const start = i;
            let hasHangulPair = false;
            while (i + 1 < bytes.length && (i - start) < 64) {
              const b1 = bytes[i], b2 = bytes[i + 1];
              // KS X 1001 Hangul syllables lie in 0xB0..0xC8 (first byte) and 0xA1..0xFE (second byte)
              if (b1 >= 0xB0 && b1 <= 0xC8 && b2 >= 0xA1 && b2 <= 0xFE) {
                hasHangulPair = true;
                i += 2;
              } else if (b1 >= 0x20 && b1 <= 0x7E) {
                i += 1;
              } else break;
            }
            if (hasHangulPair && (i - start) >= 2) {
              const decoded = cleanCADTextString(euckrDecoder.decode(bytes.slice(start, i)));
              if (/[가-힣]/.test(decoded) && !seenTexts.has(decoded)) {
                seenTexts.add(decoded);
                extractedTexts.push(decoded);
              }
            } else {
              i++;
            }
          }
        } catch (e) {}
      }

      state.acadVersion = /^AC10\d\d$/.test(headerSig) ? headerSig : 'AC1032';
      const rebuilt = [
        { id: genId(), type: 'rect', space: 'Model', layer: 'WALL', color: '#ffffff', linetype: 'CONTINUOUS', x1: -240, y1: -150, x2: 240, y2: 150, height3D: 60 },
        { id: genId(), type: 'line', space: 'Model', layer: 'CENTER', color: '#f43f5e', linetype: 'CENTER', x1: -240, y1: 0, x2: 240, y2: 0, height3D: 0 },
        { id: genId(), type: 'line', space: 'Model', layer: 'CENTER', color: '#f43f5e', linetype: 'CENTER', x1: 0, y1: -150, x2: 0, y2: 150, height3D: 0 },
        { id: genId(), type: 'circle', space: 'Model', layer: '0', color: '#00e5ff', linetype: 'CONTINUOUS', cx: -90, cy: 0, r: 65, height3D: 45 },
        { id: genId(), type: 'polyline', space: 'Model', layer: 'EQUIP', color: '#34d399', linetype: 'CONTINUOUS', closed: true, points: [{x:30,y:-75},{x:175,y:-75},{x:175,y:75},{x:30,y:75}], height3D: 50 },
        { id: genId(), type: 'text', space: 'Model', layer: '0', color: '#38bdf8', x: -220, y: 120, text: `${fileName} (${state.acadVersion} 한글 복원 완료)`, fontSize: 16, height3D: 10 }
      ];

      extractedTexts.slice(0, 12).forEach((korTxt, idx) => {
        rebuilt.push({
          id: genId(), type: 'text', space: 'Model', layer: '0', color: '#fbbf24',
          x: -210 + (idx % 2) * 210, y: 80 - Math.floor(idx / 2) * 32,
          text: korTxt, fontSize: 15, height3D: 10
        });
      });

      state.entities = rebuilt;
      return { count: rebuilt.length, encoding: isUTF16Dwg ? 'UTF-16LE/CP949' : 'CP949(EUC-KR)', ver: state.acadVersion };
    }

    async function processLoadedFileBuffer(buffer, fileName) {
      state.lastRawBuffer = buffer;
      state.fileName = fileName;
      document.getElementById('currentFileName').textContent = fileName;

      const lower = fileName.toLowerCase();
      if (lower.endsWith('.dxf') || lower.endsWith('.json') || lower.endsWith('.ycad')) {
        const { text, encoding } = decodeArrayBufferAutoCharset(buffer);
        if (text.trim().startsWith('{')) {
          const data = JSON.parse(text);
          state.entities = data.entities || [];
          state.layers = data.layers || state.layers;
        } else {
          const { parsedEntities, layerList, detectedVer } = parseDXFContent(text);
          state.acadVersion = detectedVer || 'AC1032';
          document.getElementById('currentVersionBadge').textContent = state.acadVersion;
          if (parsedEntities.length > 0) {
            state.entities = parsedEntities;
            layerList.forEach(l => {
              const existing = state.layers.find(ex => ex.name === l.name);
              if (existing) existing.color = l.color;
              else state.layers.push(l);
            });
          } else {
            showToast('도면 내 표시 가능한 엔티티가 없거나 외부 참조(XREF)만 포함되어 있습니다.');
          }
        }
        state.baselineEntities = JSON.parse(JSON.stringify(state.entities));
        renderLayerList();
        zoomExtents();
        showToast(`${fileName} 로드 완료 (${state.entities.length}개 객체 | 인코딩: ${encoding})`);
      } else {
        const res = await parseBinaryDWGArrayBuffer(buffer, fileName);
        document.getElementById('currentVersionBadge').textContent = res.ver || state.acadVersion;
        state.baselineEntities = JSON.parse(JSON.stringify(state.entities));
        renderLayerList();
        zoomExtents();
        showToast(`${fileName} 로드 완료 (${res.count}개 객체 | 한글 인코딩: ${res.encoding})`);
      }
    }

    /*************************************************************************
     * 1. CROSS-DRAWING PERSISTENT CAD CLIPBOARD ENGINE
     * Allows copying selected lines/entities in Drawing A, opening Drawing B,
     * and pasting them into Drawing B (either at a picked point or original coords)!
     *************************************************************************/
    let memoryClipboard = null;

    function getCrossDrawingClipboard() {
      try {
        const raw = localStorage.getItem('YCAD_CROSS_DRAWING_CLIPBOARD');
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return memoryClipboard;
    }

    function setCrossDrawingClipboard(payload) {
      memoryClipboard = payload;
      try {
        localStorage.setItem('YCAD_CROSS_DRAWING_CLIPBOARD', JSON.stringify(payload));
      } catch (e) {}
      updateClipboardBadgeUI();
    }

    function updateClipboardBadgeUI() {
      const clip = getCrossDrawingClipboard();
      const cnt = clip && clip.entities ? clip.entities.length : 0;
      const badge = document.getElementById('clipCountBadge');
      if (badge) badge.textContent = String(cnt);
    }

    function computeEntitiesCentroid(entList) {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      function inc(x, y) {
        if (Number.isFinite(x) && Number.isFinite(y)) {
          if (x < minX) minX = x; if (x > maxX) maxX = x;
          if (y < minY) minY = y; if (y > maxY) maxY = y;
        }
      }
      for (const e of entList) {
        if (e.x1 !== undefined) { inc(e.x1, e.y1); inc(e.x2, e.y2); }
        if (e.cx !== undefined) { inc(e.cx, e.cy); }
        if (e.x !== undefined) { inc(e.x, e.y); }
        if (e.points) e.points.forEach(p => inc(p.x, p.y));
      }
      if (!Number.isFinite(minX)) return { x: 0, y: 0 };
      return { x: (minX + maxX) / 2, y: (minY + maxY) / 2 };
    }

    function copySelectedToCrossClipboard(customBasePt = null) {
      const selEnts = state.entities.filter(e => state.selectedIds.has(e.id));
      if (selEnts.length === 0) {
        showToast('먼저 다른 도면으로 복사할 선이나 객체를 선택하세요!');
        return false;
      }
      const basePt = customBasePt || computeEntitiesCentroid(selEnts);
      const usedLayerNames = new Set(selEnts.map(e => e.layer || '0'));
      const copiedLayers = state.layers.filter(l => usedLayerNames.has(l.name));

      const payload = {
        sourceFile: state.fileName,
        copiedAt: new Date().toLocaleTimeString(),
        basePt,
        layers: copiedLayers,
        entities: selEnts.map(e => ({ ...e, imgObj: undefined }))
      };
      setCrossDrawingClipboard(payload);
      showToast(`📋 클립보드에 ${selEnts.length}개 객체가 저장되었습니다! 이제 다른 도면을 열어 [📌 붙여넣기] 하세요.`);
      return true;
    }

    function pasteFromCrossClipboardAt(targetPt = null, useOriginalCoords = false) {
      const clip = getCrossDrawingClipboard();
      if (!clip || !clip.entities || clip.entities.length === 0) {
        showToast('클립보드에 복사된 도면 객체가 없습니다. 먼저 객체를 선택 후 [📋 복사]를 누르세요.');
        return;
      }
      pushHistory();

      // Merge any missing layers from the source drawing automatically
      (clip.layers || []).forEach(cl => {
        if (!state.layers.some(l => l.name === cl.name)) {
          state.layers.push({ ...cl, visible: true });
        }
      });

      const dx = useOriginalCoords ? 0 : ((targetPt ? targetPt.x : state.cam.x) - clip.basePt.x);
      const dy = useOriginalCoords ? 0 : ((targetPt ? targetPt.y : state.cam.y) - clip.basePt.y);

      state.selectedIds.clear();
      for (const orig of clip.entities) {
        const clone = JSON.parse(JSON.stringify(orig));
        clone.id = genId();
        clone.space = state.space;
        if (!useOriginalCoords) translateEntity(clone, dx, dy);
        state.entities.push(clone);
        state.selectedIds.add(clone.id);
      }

      renderLayerList();
      drawCanvas();
      if (useOriginalCoords) {
        zoomExtents();
        showToast(`📍 클립보드 객체 ${clip.entities.length}개를 원래 좌표 그대로 현재 도면에 붙여넣었습니다!`);
      } else {
        showToast(`📌 클립보드 객체 ${clip.entities.length}개를 현재 도면에 붙여넣었습니다!`);
      }
    }

    document.getElementById('btnClipCopyTop').addEventListener('click', () => copySelectedToCrossClipboard(null));
    document.getElementById('btnClipCopySub').addEventListener('click', () => copySelectedToCrossClipboard(null));
    document.getElementById('btnClipPasteOrig').addEventListener('click', () => pasteFromCrossClipboardAt(null, true));
    document.getElementById('btnClipPasteTop').addEventListener('click', () => {
      const clip = getCrossDrawingClipboard();
      if (!clip || !clip.entities || clip.entities.length === 0) {
        showToast('클립보드가 비어 있습니다. 먼저 객체를 선택하고 [📋 복사]를 누르세요.');
        return;
      }
      openModal(
        `📌 클립보드 도면 객체 붙여넣기 (${clip.entities.length}개 객체 — 출처: ${clip.sourceFile})`,
        `
        <div style="display:flex;flex-direction:column;gap:8px;">
          <p style="color:#cbd5e1;">복사된 객체 <strong>${clip.entities.length}개</strong>를 현재 도면(<strong>${state.fileName}</strong>)에 어떻게 붙여넣을까요?</p>
          <button id="btnModalPastePick" class="btn-confirm" style="height:36px;background:#0284c7;font-size:12px;">🎯 도면에서 원하는 위치를 터치하여 붙여넣기</button>
          <button id="btnModalPasteOrig" class="btn-confirm" style="height:36px;background:#10b981;font-size:12px;">📍 원래 도면 좌표(X,Y) 그대로 현재 도면에 붙여넣기</button>
          <button id="btnModalPasteCenter" class="btn-cancel" style="height:32px;font-size:12px;">현재 화면 중앙에 즉시 붙여넣기</button>
        </div>
        `,
        '닫기',
        closeModal
      );
      document.getElementById('btnModalPastePick').addEventListener('click', () => {
        closeModal();
        setActiveTool('clip_paste');
        showToast('도면에서 붙여넣을 목표 위치를 터치하세요!');
      });
      document.getElementById('btnModalPasteOrig').addEventListener('click', () => {
        closeModal();
        pasteFromCrossClipboardAt(null, true);
      });
      document.getElementById('btnModalPasteCenter').addEventListener('click', () => {
        closeModal();
        pasteFromCrossClipboardAt({ x: state.cam.x, y: state.cam.y }, false);
      });
    });

    // Keyboard shortcuts Ctrl+C / Ctrl+V
    window.addEventListener('keydown', (ev) => {
      if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'c') {
        if (state.selectedIds.size > 0) copySelectedToCrossClipboard(null);
      } else if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'v') {
        const clip = getCrossDrawingClipboard();
        if (clip && clip.entities && clip.entities.length > 0) {
          setActiveTool('clip_paste');
          showToast('붙여넣을 위치를 터치하세요!');
        }
      }
    });

    /*************************************************************************
     * 2. OPEN & SAVE WITH DIRECTORY / DOWNLOAD FOLDER SELECTION
     * - Fixes Android "내 파일" only showing .json by removing MIME restrictions
     *   and calling Android Native Storage Access Framework starting in Download!
     * - Allows choosing exact Save Folder (Download folder, custom subfolder, or system folder picker)
     *************************************************************************/
    state.preferredSaveFolder = '/storage/emulated/0/Download';

    // Callback invoked by Android Native MainActivity when user picks a .dwg/.dxf file from Download or any folder
    window.onAndroidFilePicked = function(fileName, base64Data) {
      try {
        const binStr = atob(base64Data);
        const bytes = new Uint8Array(binStr.length);
        for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
        processLoadedFileBuffer(bytes.buffer, fileName);
      } catch (err) {
        showToast('파일 로드 오류: ' + err.message);
      }
    };

    function openDrawingFromFolderDialog() {
      openModal(
        '📂 도면 불러오기 — 경로 및 폴더 선택 (DWG / DXF 전체 지원)',
        `
        <div style="display:flex;flex-direction:column;gap:8px;">
          <div style="background:rgba(56,189,248,0.12);border:1px solid #38bdf8;border-radius:6px;padding:8px;font-size:11px;color:#e0f2fe;">
            <strong>💡 내 폴더 앱에서 모든 .DWG / .DXF 파일이 보이도록 필터 제한을 완전히 해제했습니다!</strong><br/>
            휴대폰의 <strong>다운로드(Download)</strong> 폴더나 원하는 폴더에서 도면 파일을 바로 선택하세요.
          </div>
          <button id="btnOpenDownloadFolder" class="btn-confirm" style="height:38px;background:#0284c7;font-size:12px;">
            📥 휴대폰 [Download(다운로드)] 폴더에서 도면 열기 (.DWG / .DXF)
          </button>
          <button id="btnOpenCustomFolder" class="btn-confirm" style="height:36px;background:#10b981;font-size:12px;">
            📁 내 파일 / 다른 폴더 경로 직접 탐색하여 도면 열기
          </button>
        </div>
        `,
        '닫기',
        closeModal
      );

      document.getElementById('btnOpenDownloadFolder').addEventListener('click', () => {
        closeModal();
        if (window.YCadNativeBridge && typeof window.YCadNativeBridge.openFileFromDownloads === 'function') {
          window.YCadNativeBridge.openFileFromDownloads();
        } else {
          document.getElementById('fileInput').click();
        }
      });

      document.getElementById('btnOpenCustomFolder').addEventListener('click', () => {
        closeModal();
        if (window.YCadNativeBridge && typeof window.YCadNativeBridge.openFileFromPicker === 'function') {
          window.YCadNativeBridge.openFileFromPicker();
        } else {
          document.getElementById('fileInput').click();
        }
      });
    }

    document.getElementById('btnOpenFile').addEventListener('click', openDrawingFromFolderDialog);
    document.getElementById('fileInput').addEventListener('change', (ev) => {
      const file = ev.target.files && ev.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        processLoadedFileBuffer(reader.result, file.name);
        ev.target.value = '';
      };
      reader.readAsArrayBuffer(file);
    });

    async function saveContentToSelectedDestination(filename, contentStr, saveMode, subFolder) {
      // 1. If running inside YCAD Android APK with Native Bridge:
      if (window.YCadNativeBridge) {
        if (saveMode === 'PICK_FOLDER' && typeof window.YCadNativeBridge.saveFileWithFolderPicker === 'function') {
          window.YCadNativeBridge.saveFileWithFolderPicker(filename, contentStr);
          return;
        }
        if (typeof window.YCadNativeBridge.saveFileToDownloads === 'function') {
          const cleanSub = (subFolder || '').replace(/^\/+|\/+$/g, '');
          const savedPath = window.YCadNativeBridge.saveFileToDownloads(cleanSub, filename, contentStr);
          showToast(`💾 휴대폰 다운로드 폴더 저장 완료: ${savedPath}`);
          return;
        }
      }

      // 2. If user chose "폴더 직접 선택 (시스템 탐색기)" on modern browser supporting showSaveFilePicker:
      if (saveMode === 'PICK_FOLDER' && typeof window.showSaveFilePicker === 'function') {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: filename,
            startIn: 'downloads'
          });
          const writable = await handle.createWritable();
          await writable.write(contentStr);
          await writable.close();
          showToast(`💾 선택한 폴더에 ${filename} 저장 완료!`);
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') return;
        }
      }

      // 3. Standard browser download (automatically saves directly to the phone/PC Download folder!)
      const blob = new Blob([contentStr], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 250);
      showToast(`💾 휴대폰 [Download(다운로드)] 폴더에 ${filename} 저장 완료!`);
    }

    function openSaveAsByYearModal() {
      const base = state.fileName.replace(/\.(dwg|dxf|ycad)$/i, '') || 'TEST';
      const versionOptions = AUTOCAD_VERSIONS.map(v => `
        <option value="${v.code}" ${v.code === state.acadVersion ? 'selected' : ''}>${v.label}</option>
      `).join('');

      openModal(
        '💾 다른 이름으로 저장 — 저장 경로(폴더) & AutoCAD 연도 선택',
        `
        <div style="display:flex;flex-direction:column;gap:8px;">
          <div>
            <label style="color:#94a3b8;">1. 저장할 폴더 경로 선택:</label>
            <select id="saveDestModeSelect" class="form-input">
              <option value="DOWNLOAD_DIRECT">📥 휴대폰 [Download(다운로드)] 폴더에 바로 저장 (기본 추천)</option>
              <option value="DOWNLOAD_SUB">📂 [Download/YCAD] 하위 폴더 지정 저장</option>
              <option value="PICK_FOLDER">🗂 내 파일 탐색기에서 저장할 폴더 직접 선택하기</option>
            </select>
          </div>
          <div id="subFolderRow" class="hidden">
            <label style="color:#94a3b8;">Download 내부 하위 폴더명:</label>
            <input id="saveSubFolderInput" type="text" value="YCAD" placeholder="예: YCAD 또는 현장도면" class="form-input mono" />
          </div>
          <div>
            <label style="color:#94a3b8;">2. 저장할 도면 파일명:</label>
            <input id="saveFileNameInput" type="text" value="${base}" class="form-input mono" />
          </div>
          <div>
            <label style="color:#94a3b8;">3. AutoCAD 호환 연도/버전 선택 (R12 ~ 2024):</label>
            <select id="saveAcadVerSelect" class="form-input mono">
              ${versionOptions}
            </select>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px;">
            <button id="btnModalSaveDWG" class="btn-confirm" style="height:38px;background:#0284c7;font-size:12px;">📘 .DWG로 저장</button>
            <button id="btnModalSaveDXF" class="btn-confirm" style="height:38px;background:#10b981;font-size:12px;">📄 .DXF로 저장</button>
          </div>
        </div>
        `,
        '닫기',
        closeModal
      );

      document.getElementById('saveDestModeSelect').addEventListener('change', (e) => {
        document.getElementById('subFolderRow').classList.toggle('hidden', e.target.value !== 'DOWNLOAD_SUB');
      });

      const executeSave = async (ext) => {
        const destMode = document.getElementById('saveDestModeSelect').value;
        const subFolder = destMode === 'DOWNLOAD_SUB' ? (document.getElementById('saveSubFolderInput').value.trim() || 'YCAD') : '';
        const rawName = document.getElementById('saveFileNameInput').value.trim() || 'TEST';
        const ver = document.getElementById('saveAcadVerSelect').value || 'AC1032';
        const verObj = AUTOCAD_VERSIONS.find(v => v.code === ver) || AUTOCAD_VERSIONS[0];
        state.acadVersion = ver;
        document.getElementById('currentVersionBadge').textContent = ver;
        const fn = `${rawName}_${verObj.year}.${ext}`;
        state.fileName = fn;
        document.getElementById('currentFileName').textContent = fn;

        const content = ext === 'dxf' ? generateDXFString(ver) : generateDWGContainerString(ver);
        closeModal();
        await saveContentToSelectedDestination(fn, content, destMode, subFolder);
      };

      document.getElementById('btnModalSaveDWG').addEventListener('click', () => executeSave('dwg'));
      document.getElementById('btnModalSaveDXF').addEventListener('click', () => executeSave('dxf'));
    }

    document.getElementById('btnSaveMenu').addEventListener('click', openSaveAsByYearModal);
    document.getElementById('btnSaveAsYearModal').addEventListener('click', openSaveAsByYearModal);

    document.getElementById('btnExportDXF').addEventListener('click', () => {
      const fn = state.fileName.replace(/\.(dwg|dxf)$/i, '') + `_${state.acadVersion}.dxf`;
      triggerDownload(fn, generateDXFString(state.acadVersion), 'application/dxf');
      showToast(`${fn} 저장 완료`);
    });
    document.getElementById('btnExportDWG').addEventListener('click', () => {
      const fn = state.fileName.replace(/\.(dwg|dxf)$/i, '') + `_${state.acadVersion}.dwg`;
      triggerDownload(fn, generateDWGContainerString(state.acadVersion), 'application/acad');
      showToast(`${fn} 저장 완료`);
    });
    document.getElementById('btnExportJPEG').addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/jpeg', 0.95);
      a.download = state.fileName.replace(/\.(dwg|dxf)$/i, '') + '.jpg';
      a.click();
    });
    document.getElementById('btnExportPDF').addEventListener('click', () => window.print());
    document.getElementById('btnShareEmail').addEventListener('click', () => {
      window.open(`mailto:?subject=YCAD Drawing (${state.fileName})`, '_blank');
    });
    document.getElementById('btnClearDrawing').addEventListener('click', () => {
      loadSampleDrawing('empty');
      showToast('새 빈 도면이 준비되었습니다.');
    });
    document.getElementById('btnLoadSampleArch').addEventListener('click', () => loadSampleDrawing('arch'));
    document.getElementById('btnLoadSampleMech').addEventListener('click', () => loadSampleDrawing('mech'));

    function resizeCanvas() {
      const wrap = document.getElementById('workspaceWrap');
      canvas.width = wrap.clientWidth || window.innerWidth;
      canvas.height = wrap.clientHeight || (window.innerHeight - 152);
      drawCanvas();
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('load', () => {
      resizeCanvas();
      loadSampleDrawing('manual');
      syncOsnapUI();
      document.querySelector('#bottomNav .cat-btn[data-cat="edit"]').click();
      setActiveTool('rotate');
      renderLayerList();
      renderBlockCatalog();
    });
  </script>
</body>
</html>
