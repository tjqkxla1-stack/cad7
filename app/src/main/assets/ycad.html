    function updateCoordsFromClient(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const sx = clientX - rect.left, sy = clientY - rect.top;
      state.pointerScreen = { x: clientX, y: clientY };
      const rawWorld = screenToWorld(sx, sy);

      state.snapPoint = findClosestSnap(rawWorld.x, rawWorld.y);
      state.polarGuideAngle = null;
      let finalPt = state.snapPoint ? { x: state.snapPoint.x, y: state.snapPoint.y } : rawWorld;

      if (!state.snapPoint && state.tempPoints.length > 0) {
        const ref = state.tempPoints[state.tempPoints.length - 1];
        const dx = rawWorld.x - ref.x, dy = rawWorld.y - ref.y, dist = Math.hypot(dx, dy);
        if (dist > 1e-3) {
          if (state.orthoEnabled) {
            if (Math.abs(dx) >= Math.abs(dy)) finalPt = { x: rawWorld.x, y: ref.y };
            else finalPt = { x: ref.x, y: rawWorld.y };
            state.polarGuideAngle = Math.atan2(finalPt.y - ref.y, finalPt.x - ref.x);
          } else if (state.polarEnabled) {
            const rawDeg = (Math.atan2(dy, dx) * 180) / Math.PI;
            const nearestStep = Math.round(rawDeg / state.polarStepDeg) * state.polarStepDeg;
            if (Math.abs(rawDeg - nearestStep) <= 4.0) {
              const rad = (nearestStep * Math.PI) / 180;
              finalPt = { x: ref.x + Math.cos(rad) * dist, y: ref.y + Math.sin(rad) * dist };
              state.polarGuideAngle = rad;
            }
          }
        }
      }

      state.pointerWorld = finalPt;
      document.getElementById('coordX').textContent = state.pointerWorld.x.toFixed(1);
      document.getElementById('coordY').textContent = state.pointerWorld.y.toFixed(1);
      const snapReadout = document.getElementById('snapActiveReadout');
      if (state.snapPoint) {
        snapReadout.textContent = `🎯${state.snapPoint.label}`;
        snapReadout.style.color = '#10b981';
      } else if (state.polarGuideAngle !== null) {
        const deg = ((state.polarGuideAngle * 180) / Math.PI + 360) % 360;
        snapReadout.textContent = `🧭${deg.toFixed(0)}°`;
        snapReadout.style.color = '#38bdf8';
      } else {
        snapReadout.textContent = state.osnapEnabled ? 'OSNAP' : 'OFF';
        snapReadout.style.color = '#64748b';
      }

      if (state.tempPoints.length > 0) {
        if (state.activeTool === 'rotate' && state.tempPoints.length === 2) {
          const a = state.tempPoints[0], b = state.tempPoints[1];
          const deltaDeg = ((Math.atan2(state.pointerWorld.y - a.y, state.pointerWorld.x - a.x) - Math.atan2(b.y - a.y, b.x - a.x)) * 180) / Math.PI;
          document.getElementById('inputParam1').value = deltaDeg.toFixed(2);
        } else if (state.activeTool === 'scale' && state.tempPoints.length === 2) {
          const a = state.tempPoints[0], b = state.tempPoints[1];
          const refD = Math.max(1e-3, Math.hypot(b.x - a.x, b.y - a.y));
          const curD = Math.hypot(state.pointerWorld.x - a.x, state.pointerWorld.y - a.y);
          document.getElementById('inputParam1').value = (curD / refD).toFixed(3);
        } else if (!['offset', 'fillet', 'chamfer'].includes(state.activeTool)) {
          const p0 = state.tempPoints[state.tempPoints.length - 1];
          const dx = state.pointerWorld.x - p0.x, dy = state.pointerWorld.y - p0.y;
          if (state.activeTool === 'rect' || state.activeTool === 'markup_rect' || state.activeTool === 'hatch') {
            document.getElementById('inputParam1').value = Math.abs(dx).toFixed(1);
            document.getElementById('inputParam2').value = Math.abs(dy).toFixed(1);
          } else {
            document.getElementById('inputParam1').value = Math.hypot(dx, dy).toFixed(1);
            document.getElementById('inputParam2').value = ((Math.atan2(dy, dx) * 180) / Math.PI).toFixed(1);
          }
        }
      }
    }

    // Touch & Mouse Event Handling
    let activeTouches = [];

    canvas.addEventListener('touchstart', (ev) => {
      ev.preventDefault();
      activeTouches = Array.from(ev.touches);
      if (activeTouches.length >= 2) {
        clearTimeout(state.longPressTimer);
        state.loupeActive = false;
        loupeCanvas.style.display = 'none';
        state.isDragging = true;
        state.dragMode = 'pinch';
        const t1 = activeTouches[0], t2 = activeTouches[1];
        state.pinchStartDist = Math.max(10, Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY));
        state.pinchStartCenter = { x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 };
        state.dragStartCam = { ...state.cam };
        return;
      }
      if (activeTouches.length === 1) {
        const t = activeTouches[0];
        handleSinglePointerDown(t.clientX, t.clientY, false);
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', (ev) => {
      ev.preventDefault();
      activeTouches = Array.from(ev.touches);
      if (activeTouches.length >= 2 && state.dragMode === 'pinch') {
        const t1 = activeTouches[0], t2 = activeTouches[1];
        const curDist = Math.max(10, Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY));
        const curCenter = { x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 };
        const scale = curDist / state.pinchStartDist;
        state.cam.zoom = Math.max(1e-6, Math.min(1e6, state.dragStartCam.zoom * scale));
        state.cam.x = state.dragStartCam.x - (curCenter.x - state.pinchStartCenter.x) / state.cam.zoom;
        state.cam.y = state.dragStartCam.y + (curCenter.y - state.pinchStartCenter.y) / state.cam.zoom;
        updateZoomLabel();
        drawCanvas();
        return;
      }
      if (activeTouches.length === 1) {
        const t = activeTouches[0];
        handleSinglePointerMove(t.clientX, t.clientY);
      }
    }, { passive: false });

    canvas.addEventListener('touchend', (ev) => {
      ev.preventDefault();
      if (ev.touches.length === 0) handleSinglePointerUp();
      activeTouches = Array.from(ev.touches);
    }, { passive: false });

    let mouseDown = false;
    canvas.addEventListener('mousedown', (ev) => {
      mouseDown = true;
      handleSinglePointerDown(ev.clientX, ev.clientY, ev.button === 1 || ev.button === 2);
    });
    window.addEventListener('mousemove', (ev) => {
      handleSinglePointerMove(ev.clientX, ev.clientY);
    });
    window.addEventListener('mouseup', () => {
      if (mouseDown) {
        mouseDown = false;
        handleSinglePointerUp();
      }
    });
    canvas.addEventListener('contextmenu', e => e.preventDefault());

    canvas.addEventListener('wheel', (ev) => {
      ev.preventDefault();
      const factor = ev.deltaY < 0 ? 1.15 : 0.87;
      state.cam.zoom = Math.max(1e-6, Math.min(1e6, state.cam.zoom * factor));
      updateZoomLabel();
      drawCanvas();
    }, { passive: false });

    function handleSinglePointerDown(clientX, clientY, forcePan) {
      updateCoordsFromClient(clientX, clientY);
      state.dragStartScreen = { x: clientX, y: clientY };
      state.dragStartWorld = { x: state.pointerWorld.x, y: state.pointerWorld.y };
      state.dragStartCam = { ...state.cam };

      clearTimeout(state.longPressTimer);
      state.longPressTimer = setTimeout(() => {
        if (state.dragMode !== 'pinch' && state.dragMode !== 'pan') {
          state.loupeActive = true;
          updateMagnifierLoupe();
        }
      }, 380);

      if (state.viewMode !== '2D') {
        state.isDragging = true;
        state.dragMode = forcePan ? 'pan' : 'orbit';
        return;
      }
      if (forcePan || state.activeTool === 'pan') {
        state.isDragging = true;
        state.dragMode = 'pan';
        return;
      }

      const pt = { x: state.pointerWorld.x, y: state.pointerWorld.y };

      if (state.activeTool === 'brush' || state.activeTool === 'smartpen') {
        state.isDragging = true;
        state.dragMode = state.activeTool;
        state.tempPoints = [pt];
        drawCanvas();
        return;
      }

      if (state.activeTool === 'select' && state.selectedIds.size > 0) {
        const rect = canvas.getBoundingClientRect();
        for (const id of state.selectedIds) {
          const ent = state.entities.find(item => item.id === id);
          if (!ent) continue;
          for (const g of getEntityGrips(ent)) {
            const sp = worldToScreen(g.x, g.y, 0);
            if (Math.hypot((clientX - rect.left) - sp.x, (clientY - rect.top) - sp.y) <= 16) {
              pushHistory();
              state.isDragging = true;
              state.dragMode = 'grip';
              state.activeGrip = g;
              return;
            }
          }
        }
      }

      const modifyTools = ['rotate', 'move', 'copy', 'scale', 'mirror', 'align'];
      if (modifyTools.includes(state.activeTool) && state.selectedIds.size === 0) {
        const hit = hitTestEntity(pt.x, pt.y);
        if (hit) {
          state.selectedIds.add(hit.id);
          showToast(`객체 선택됨 (${hit.type.toUpperCase()}) — 이제 기준점(A)을 찍으세요!`);
          drawCanvas();
          return;
        }
      }

      state.isDragging = true;
      state.dragMode = 'tool_drag';
      handleToolPointClick(pt);
    }

    function handleSinglePointerMove(clientX, clientY) {
      updateCoordsFromClient(clientX, clientY);
      const dxScreen = clientX - state.dragStartScreen.x;
      const dyScreen = clientY - state.dragStartScreen.y;

      if (Math.hypot(dxScreen, dyScreen) > 8 && !state.loupeActive) {
        clearTimeout(state.longPressTimer);
      }

      if (state.isDragging) {
        if (state.dragMode === 'pan') {
          state.cam.x = state.dragStartCam.x - dxScreen / state.cam.zoom;
          state.cam.y = state.dragStartCam.y + dyScreen / state.cam.zoom;
        } else if (state.dragMode === 'orbit') {
          state.cam.rotZ = state.dragStartCam.rotZ + dxScreen * 0.01;
          state.cam.rotX = Math.max(0.1, Math.min(1.45, state.cam.rotX + dyScreen * 0.01));
        } else if (state.dragMode === 'grip' && state.activeGrip) {
          applyGripMove(state.activeGrip, state.pointerWorld.x, state.pointerWorld.y);
        } else if (state.dragMode === 'brush' || state.dragMode === 'smartpen') {
          state.tempPoints.push({ x: state.pointerWorld.x, y: state.pointerWorld.y });
        }
      }
      drawCanvas();
    }

    function handleSinglePointerUp() {
      clearTimeout(state.longPressTimer);
      if (state.loupeActive) {
        state.loupeActive = false;
        loupeCanvas.style.display = 'none';
      }

      if (state.isDragging) {
        if (state.dragMode === 'box_select') {
          const dragScreenDist = Math.hypot(state.pointerScreen.x - state.dragStartScreen.x, state.pointerScreen.y - state.dragStartScreen.y);
          if (dragScreenDist > 12) {
            selectEntitiesByBox(state.dragStartWorld, state.pointerWorld);
            showToast(`${state.selectedIds.size}개 객체 선택됨`);
          }
        } else if (state.dragMode === 'brush' && state.tempPoints.length > 1) {
          pushHistory();
          state.entities.push({
            id: genId(), type: 'brush', space: state.space, layer: 'MARKUP', color: state.activeColor,
            points: [...state.tempPoints], lineWidth: 2.5
          });
          state.tempPoints = [];
          showToast('자유선 브러시 작성 완료');
        } else if (state.dragMode === 'smartpen' && state.tempPoints.length > 2) {
          finishSmartPenStroke(state.tempPoints);
          state.tempPoints = [];
        } else if (state.dragMode === 'tool_drag' && state.tempPoints.length === 1) {
          const dragWorldDist = Math.hypot(state.pointerWorld.x - state.tempPoints[0].x, state.pointerWorld.y - state.tempPoints[0].y);
          const dragScreenDist = Math.hypot(state.pointerScreen.x - state.dragStartScreen.x, state.pointerScreen.y - state.dragStartScreen.y);
          const twoPtTools = ['line', 'circle', 'rect', 'markup_rect', 'hatch', 'dim_linear', 'dim_aligned', 'meas_dist'];
          if (dragScreenDist > 20 && dragWorldDist > 2 && twoPtTools.includes(state.activeTool)) {
            handleToolPointClick({ x: state.pointerWorld.x, y: state.pointerWorld.y });
            if (state.activeTool === 'line') state.tempPoints = [];
          }
        }
        state.isDragging = false;
        state.dragMode = null;
        state.activeGrip = null;
        drawCanvas();
      }
    }

    function handleToolPointClick(pt) {
      const t = state.activeTool;

      if (t === 'clip_copy_base') {
        copySelectedToCrossClipboard(pt);
        setActiveTool('select');
        return;
      }

      if (t === 'clip_paste') {
        pasteFromCrossClipboardAt(pt, false);
        return;
      }

      if (t === 'select') {
        const hit = hitTestEntity(pt.x, pt.y);
        if (hit) {
          if (hit.type === 'voice_note') playSynthesizedVoiceNote(hit);
          else if (hit.type === 'field_pin') openFieldPinViewModal(hit);
          if (state.selectedIds.has(hit.id)) state.selectedIds.delete(hit.id);
          else state.selectedIds.add(hit.id);
          renderPropsInspectorIfOpen();
        } else {
          state.dragMode = 'box_select';
        }
        drawCanvas();
        return;
      }

      if (t === 'trim') {
        performTrimAtPoint(pt.x, pt.y);
        return;
      }

      if (t === 'extend') {
        performExtendAtPoint(pt.x, pt.y);
        return;
      }

      if (t === 'offset') {
        if (!state.tempTargetEntity) {
          const hit = hitTestEntity(pt.x, pt.y);
          if (!hit) { showToast('간격띄우기(Offset)할 객체를 먼저 터치하세요.'); return; }
          state.tempTargetEntity = hit;
          document.getElementById('statusPrompt').textContent = '2단계: 간격을 띄울 방향(안쪽 또는 바깥쪽)을 터치하세요!';
          showToast('객체 선택됨 → 이제 간격을 띄울 방향을 터치하세요!');
        } else {
          const dist = Math.max(0.5, parseFloat(document.getElementById('inputParam1').value) || 25);
          performOffsetEntity(state.tempTargetEntity, pt, dist);
          state.tempTargetEntity = null;
          document.getElementById('statusPrompt').textContent = '1단계: 간격띄우기할 다음 객체를 터치하세요.';
        }
        drawCanvas();
        return;
      }

      if (t === 'fillet' || t === 'chamfer') {
        const hit = hitTestEntity(pt.x, pt.y);
        if (!hit) { showToast('모깎기/모따기할 선(Line)을 터치하세요.'); return; }
        if (hit.type === 'rect' || hit.type === 'polyline') explodeEntity(hit);
        const lineHit = hitTestEntity(pt.x, pt.y);
        if (!lineHit || lineHit.type !== 'line') { showToast('선(Line) 객체를 터치하세요.'); return; }
        if (!state.tempTargetEntity) {
          state.tempTargetEntity = lineHit;
          showToast('첫 번째 선 선택됨 → 이제 교차할 두 번째 선을 터치하세요!');
        } else if (state.tempTargetEntity.id !== lineHit.id) {
          const p1 = parseFloat(document.getElementById('inputParam1').value) || 0;
          const p2 = parseFloat(document.getElementById('inputParam2').value) || p1;
          performFilletOrChamfer(state.tempTargetEntity, lineHit, t, p1, p2);
          state.tempTargetEntity = null;
        }
        drawCanvas();
        return;
      }

      if (t === 'match_prop') {
        const hit = hitTestEntity(pt.x, pt.y);
        if (!hit) { showToast('객체를 터치하세요.'); return; }
        if (!state.copiedProps) {
          state.copiedProps = { layer: hit.layer, color: hit.color, linetype: hit.linetype || 'CONTINUOUS', lineWidth: hit.lineWidth || 1.7 };
          showToast(`🖌 특성 복사됨(레이어:${hit.layer}) → 이제 입힐 대상 객체를 터치하세요!`);
        } else {
          pushHistory();
          hit.layer = state.copiedProps.layer;
          hit.color = state.copiedProps.color;
          hit.linetype = state.copiedProps.linetype;
          hit.lineWidth = state.copiedProps.lineWidth;
          showToast('🖌 특성 일치 적용 완료!');
        }
        drawCanvas();
        return;
      }

      if (t === 'field_pin') {
        openNewFieldPinModal(pt);
        return;
      }

      if (t === 'point_node') {
        pushHistory();
        state.entities.push({ id: genId(), type: 'point_node', space: state.space, layer: state.currentLayer, color: state.activeColor, x: pt.x, y: pt.y });
        drawCanvas();
        showToast(`점(Point) 생성: (${pt.x.toFixed(1)}, ${pt.y.toFixed(1)})`);
        return;
      }

      if (t === 'erase') {
        const hit = hitTestEntity(pt.x, pt.y);
        if (hit) {
          pushHistory();
          state.entities = state.entities.filter(e => e.id !== hit.id);
          drawCanvas();
          showToast('객체 삭제 완료');
        }
        return;
      }

      if (t === 'edit_text') {
        const hit = hitTestEntity(pt.x, pt.y);
        if (hit && (hit.type === 'text' || hit.type === 'markup_text')) openTextEditorModal(hit);
        else showToast('수정할 문자를 터치하세요.');
        return;
      }

      if (t === 'block_attr') {
        const hit = hitTestEntity(pt.x, pt.y);
        if (hit && hit.type === 'block_ref') openBlockAttributeModal(hit, false);
        else showToast('속성을 편집할 블록을 터치하세요.');
        return;
      }

      if (t === 'text' || t === 'markup_text') {
        openNewTextModal(pt, t === 'markup_text');
        return;
      }

      if (t === 'insert_block') {
        const def = state.pendingBlockDef || BLOCK_CATALOG[0];
        const newBlock = {
          id: genId(), type: 'block_ref', space: state.space, layer: state.currentLayer, color: state.activeColor,
          blockName: def.name, x: pt.x, y: pt.y, scale: 1.0, rotation: 0,
          attributes: { ...def.attributes }, height3D: 45
        };
        openBlockAttributeModal(newBlock, true);
        return;
      }

      if (t === 'voice_note') {
        openVoiceRecordModal(pt);
        return;
      }

      if (t === 'dim_ordinate') {
        pushHistory();
        state.entities.push({ id: genId(), type: 'dim_ordinate', space: state.space, layer: 'DIM', color: '#fbbf24', x: pt.x, y: pt.y });
        drawCanvas();
        showToast(`좌표 치수: X=${pt.x.toFixed(1)}, Y=${pt.y.toFixed(1)}`);
        return;
      }

      if (t === 'dim_radial' || t === 'dim_arclen') {
        const hit = hitTestEntity(pt.x, pt.y);
        if (hit && (hit.type === 'circle' || hit.type === 'arc')) {
          pushHistory();
          if (t === 'dim_radial') {
            state.entities.push({ id: genId(), type: 'dim_radial', space: state.space, layer: 'DIM', color: '#fbbf24', cx: hit.cx, cy: hit.cy, r: hit.r, angle: 0.55 });
            showToast(`반지름 치수: R${hit.r.toFixed(1)}`);
          } else {
            const arcLen = hit.r * Math.PI * 0.75;
            state.entities.push({ id: genId(), type: 'dim_arclen', space: state.space, layer: 'DIM', color: '#fbbf24', cx: hit.cx, cy: hit.cy, r: hit.r, startAngle: 0, endAngle: Math.PI * 0.75, arcLen });
            showToast(`호 길이 치수: ⌒${arcLen.toFixed(1)}`);
          }
          drawCanvas();
          return;
        }
      }

      state.tempPoints.push(pt);
      const pts = state.tempPoints;

      // 3-Point Relative Rotate (A -> B -> C)
      if (t === 'rotate') {
        if (pts.length === 1) {
          document.getElementById('statusPrompt').textContent = '2단계: 회전할 참조 꼭짓점(B)을 스냅하여 터치하세요.';
          showToast('기준점(A) 지정됨 → 참조 꼭짓점(B)을 찍으세요!');
        } else if (pts.length === 2) {
          if (Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y) < 1e-3) { pts.pop(); return; }
          document.getElementById('statusPrompt').textContent = '3단계: 정렬될 목표 꼭짓점(C)을 터치하세요!';
          showToast('참조점(B) 지정됨 → 목표 꼭짓점(C)을 찍으면 회전합니다!');
        } else if (pts.length === 3) {
          const angB = Math.atan2(pts[1].y - pts[0].y, pts[1].x - pts[0].x);
          const angC = Math.atan2(pts[2].y - pts[0].y, pts[2].x - pts[0].x);
          const deltaDeg = ((angC - angB) * 180) / Math.PI;
          pushHistory();
          state.entities.forEach(e => { if (state.selectedIds.has(e.id)) rotateEntity(e, pts[0].x, pts[0].y, deltaDeg); });
          state.tempPoints = [];
          document.getElementById('statusPrompt').textContent = `상대 회전 완료 (Δ=${deltaDeg.toFixed(2)}°)`;
          showToast(`3점 상대 참조 회전 완료! (Δ=${deltaDeg.toFixed(2)}°)`);
        }
        drawCanvas();
        return;
      }

      // 3-Point Relative Scale (A -> B -> C)
      if (t === 'scale') {
        if (pts.length === 1) {
          document.getElementById('statusPrompt').textContent = '2단계: 참조 길이점(B)을 터치하세요.';
        } else if (pts.length === 2) {
          document.getElementById('statusPrompt').textContent = '3단계: 새로운 목표 길이점(C)을 터치하세요!';
        } else if (pts.length === 3) {
          const refD = Math.max(1e-3, Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y));
          const newD = Math.max(1e-3, Math.hypot(pts[2].x - pts[0].x, pts[2].y - pts[0].y));
          const factor = newD / refD;
          pushHistory();
          state.entities.forEach(e => { if (state.selectedIds.has(e.id)) scaleEntity(e, pts[0].x, pts[0].y, factor); });
          state.tempPoints = [];
          showToast(`3점 상대 참조 배율 완료 (x${factor.toFixed(3)})`);
        }
        drawCanvas();
        return;
      }

      if (t === 'circle' && pts.length === 2) {
        const r = Math.max(2, Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y));
        pushHistory();
        state.entities.push({ id: genId(), type: 'circle', space: state.space, layer: state.currentLayer, color: state.activeColor, linetype: state.activeLinetype, cx: pts[0].x, cy: pts[0].y, r, height3D: 40 });
        state.tempPoints = [];
        showToast(`원 생성: R=${r.toFixed(2)}`);
      } else if (t === 'line' && pts.length >= 2) {
        const p1 = pts[pts.length - 2], p2 = pts[pts.length - 1];
        if (Math.hypot(p2.x - p1.x, p2.y - p1.y) > 0.5) {
          pushHistory();
          state.entities.push({ id: genId(), type: 'line', space: state.space, layer: state.currentLayer, color: state.activeColor, linetype: state.activeLinetype, x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, height3D: 40 });
        }
      } else if ((t === 'rect' || t === 'markup_rect') && pts.length === 2) {
        pushHistory();
        state.entities.push({
          id: genId(), type: t, space: state.space,
          layer: t === 'markup_rect' ? 'MARKUP' : state.currentLayer,
          color: t === 'markup_rect' ? '#f43f5e' : state.activeColor,
          linetype: state.activeLinetype,
          x1: pts[0].x, y1: pts[0].y, x2: pts[1].x, y2: pts[1].y, height3D: 45
        });
        state.tempPoints = [];
        showToast('사각형 생성 완료');
      } else if (t === 'hatch' && pts.length === 2) {
        pushHistory();
        state.entities.push({
          id: genId(), type: 'hatch', space: state.space, layer: state.currentLayer, color: state.activeColor,
          pattern: 'ANSI31', x1: pts[0].x, y1: pts[0].y, x2: pts[1].x, y2: pts[1].y
        });
        state.tempPoints = [];
        showToast('▤ Hatch(해치 패턴) 생성 완료');
      } else if (t === 'arc' && pts.length === 3) {
        const c = pts[0];
        const r = Math.max(5, Math.hypot(pts[1].x - c.x, pts[1].y - c.y));
        const a1 = Math.atan2(pts[1].y - c.y, pts[1].x - c.x), a2 = Math.atan2(pts[2].y - c.y, pts[2].x - c.x);
        pushHistory();
        state.entities.push({ id: genId(), type: 'arc', space: state.space, layer: state.currentLayer, color: state.activeColor, linetype: state.activeLinetype, cx: c.x, cy: c.y, r, startAngle: a1, endAngle: a2, height3D: 30 });
        state.tempPoints = [];
        showToast('원호 생성 완료');
      } else if ((t === 'dim_linear' || t === 'dim_aligned') && pts.length === 2) {
        pushHistory();
        state.entities.push({ id: genId(), type: t, space: state.space, layer: 'DIM', color: '#fbbf24', x1: pts[0].x, y1: pts[0].y, x2: pts[1].x, y2: pts[1].y, offset: 28 });
        state.tempPoints = [];
        showToast('치수선 생성 완료');
      } else if (t === 'dim_angular' && pts.length === 3) {
        const a1 = Math.atan2(pts[1].y - pts[0].y, pts[1].x - pts[0].x), a2 = Math.atan2(pts[2].y - pts[0].y, pts[2].x - pts[0].x);
        let deg = Math.abs((a2 - a1) * 180 / Math.PI);
        if (deg > 180) deg = 360 - deg;
        pushHistory();
        state.entities.push({ id: genId(), type: 'dim_angular', space: state.space, layer: 'DIM', color: '#fbbf24', cx: pts[0].x, cy: pts[0].y, x1: pts[1].x, y1: pts[1].y, x2: pts[2].x, y2: pts[2].y, angleDeg: deg });
        state.tempPoints = [];
        showToast(`각도 치수: ${deg.toFixed(1)}°`);
      } else if (t === 'meas_dist' && pts.length === 2) {
        const dx = pts[1].x - pts[0].x, dy = pts[1].y - pts[0].y;
        const len = Math.hypot(dx, dy), ang = (Math.atan2(dy, dx) * 180) / Math.PI;
        const readout = document.getElementById('measureReadout');
        readout.textContent = `L=${len.toFixed(2)} (∠${ang.toFixed(1)}°)`;
        readout.classList.remove('hidden');
        state.tempPoints = [];
        showToast(`거리: ${len.toFixed(2)} | 각도: ${ang.toFixed(2)}°`);
      } else if (t === 'move' && pts.length === 2) {
        if (state.selectedIds.size > 0) {
          pushHistory();
          const dx = pts[1].x - pts[0].x, dy = pts[1].y - pts[0].y;
          state.entities.forEach(e => { if (state.selectedIds.has(e.id)) translateEntity(e, dx, dy); });
          showToast('이동 완료');
        }
        state.tempPoints = [];
      } else if (t === 'copy' && pts.length === 2) {
        if (state.selectedIds.size > 0) {
          pushHistory();
          const dx = pts[1].x - pts[0].x, dy = pts[1].y - pts[0].y;
          const clones = [];
          state.entities.forEach(e => {
            if (state.selectedIds.has(e.id)) {
              const c = JSON.parse(JSON.stringify(e));
              c.id = genId();
              translateEntity(c, dx, dy);
              clones.push(c);
            }
          });
          state.entities.push(...clones);
          showToast('복사 완료');
        }
        state.tempPoints = [];
      } else if (t === 'mirror' && pts.length === 2) {
        if (state.selectedIds.size > 0) {
          pushHistory();
          const mirrored = [];
          state.entities.forEach(e => {
            if (state.selectedIds.has(e.id)) mirrored.push(mirrorEntityClone(e, pts[0].x, pts[0].y, pts[1].x, pts[1].y));
          });
          state.entities.push(...mirrored);
          showToast('대칭 복제 완료');
        }
        state.tempPoints = [];
      } else if (t === 'align' && pts.length === 4) {
        if (state.selectedIds.size > 0) {
          pushHistory();
          const srcAngle = Math.atan2(pts[2].y - pts[0].y, pts[2].x - pts[0].x);
          const dstAngle = Math.atan2(pts[3].y - pts[1].y, pts[3].x - pts[1].x);
          const rotDeg = ((dstAngle - srcAngle) * 180) / Math.PI;
          const dx = pts[1].x - pts[0].x, dy = pts[1].y - pts[0].y;
          state.entities.forEach(e => {
            if (state.selectedIds.has(e.id)) {
              translateEntity(e, dx, dy);
              rotateEntity(e, pts[1].x, pts[1].y, rotDeg);
            }
          });
          showToast(`4점 정렬 완료`);
        }
        state.tempPoints = [];
      }
      drawCanvas();
    }

    // Confirm Button (✓)
    document.getElementById('btnConfirmTool').addEventListener('click', () => {
      const val1 = parseFloat(document.getElementById('inputParam1').value) || 0;
      const val2 = parseFloat(document.getElementById('inputParam2').value) || 0;
      const t = state.activeTool;
      const pts = state.tempPoints;

      if (t === 'rotate' && state.selectedIds.size > 0) {
        const origin = pts[0] || { x: state.cam.x, y: state.cam.y };
        pushHistory();
        state.entities.forEach(e => { if (state.selectedIds.has(e.id)) rotateEntity(e, origin.x, origin.y, val1); });
        state.tempPoints = [];
        showToast(`정밀 각도 회전: ${val1}°`);
      } else if (t === 'scale' && state.selectedIds.size > 0) {
        const origin = pts[0] || { x: state.cam.x, y: state.cam.y };
        const factor = val1 > 0 ? val1 : 1.0;
        pushHistory();
        state.entities.forEach(e => { if (state.selectedIds.has(e.id)) scaleEntity(e, origin.x, origin.y, factor); });
        state.tempPoints = [];
        showToast(`정밀 배율 적용: x${factor}`);
      } else if (t === 'circle') {
        const c = pts[0] || { x: state.cam.x, y: state.cam.y };
        pushHistory();
        state.entities.push({ id: genId(), type: 'circle', space: state.space, layer: state.currentLayer, color: state.activeColor, linetype: state.activeLinetype, cx: c.x, cy: c.y, r: Math.max(1, val1), height3D: 40 });
        state.tempPoints = [];
        showToast(`원 생성: R=${val1}`);
      } else if (t === 'line') {
        const p0 = pts[pts.length - 1] || { x: state.cam.x, y: state.cam.y };
        const rad = (val2 * Math.PI) / 180;
        const p1 = { x: p0.x + Math.cos(rad) * val1, y: p0.y + Math.sin(rad) * val1 };
        pushHistory();
        state.entities.push({ id: genId(), type: 'line', space: state.space, layer: state.currentLayer, color: state.activeColor, linetype: state.activeLinetype, x1: p0.x, y1: p0.y, x2: p1.x, y2: p1.y, height3D: 40 });
        state.tempPoints = [p1];
        showToast(`선 생성: L=${val1}, ∠=${val2}°`);
      } else if (t === 'rect' || t === 'markup_rect') {
        const p0 = pts[0] || { x: state.cam.x, y: state.cam.y };
        const h = val2 > 0 ? val2 : val1 * 0.65;
        pushHistory();
        state.entities.push({
          id: genId(), type: t, space: state.space,
          layer: t === 'markup_rect' ? 'MARKUP' : state.currentLayer,
          color: t === 'markup_rect' ? '#f43f5e' : state.activeColor,
          linetype: state.activeLinetype,
          x1: p0.x, y1: p0.y, x2: p0.x + val1, y2: p0.y + h, height3D: 45
        });
        state.tempPoints = [];
      } else if (t === 'polyline' && pts.length >= 2) {
        pushHistory();
        state.entities.push({ id: genId(), type: 'polyline', space: state.space, layer: state.currentLayer, color: state.activeColor, linetype: state.activeLinetype, closed: false, points: [...pts], height3D: 45 });
        state.tempPoints = [];
        showToast('폴리라인 완료');
      } else if (t === 'revcloud' && pts.length >= 2) {
        pushHistory();
        state.entities.push({ id: genId(), type: 'revcloud', space: state.space, layer: 'MARKUP', color: '#f43f5e', points: [...pts] });
        state.tempPoints = [];
      } else if (t === 'meas_area' && pts.length >= 3) {
        let area = 0, perim = 0;
        for (let i = 0; i < pts.length; i++) {
          const j = (i + 1) % pts.length;
          area += pts[i].x * pts[j].y - pts[j].x * pts[i].y;
          perim += Math.hypot(pts[j].x - pts[i].x, pts[j].y - pts[i].y);
        }
        area = Math.abs(area) / 2;
        const readout = document.getElementById('measureReadout');
        readout.textContent = `A=${area.toFixed(1)} P=${perim.toFixed(1)}`;
        readout.classList.remove('hidden');
        state.tempPoints = [];
        showToast(`면적: ${area.toFixed(1)} / 둘레: ${perim.toFixed(1)}`);
      }
      drawCanvas();
    });

    function renderPropsInspector() {
      const box = document.getElementById('propsInspectorBox');
      if (state.selectedIds.size === 0) {
        box.innerHTML = '<p style="color:#94a3b8;">선택된 객체가 없습니다. 도면에서 객체를 터치하면 정확한 좌표·길이·반지름·레이어·선종류 제원이 표시되며 직접 수정할 수 있습니다.</p>';
        return;
      }
      const firstId = Array.from(state.selectedIds)[0];
      const e = state.entities.find(item => item.id === firstId);
      if (!e) return;

      let geomInfo = '';
      if (e.type === 'line') {
        const len = Math.hypot(e.x2 - e.x1, e.y2 - e.y1);
        const ang = (Math.atan2(e.y2 - e.y1, e.x2 - e.x1) * 180) / Math.PI;
        geomInfo = `
          <div>길이(Length): <strong class="mono" style="color:#38bdf8;">${len.toFixed(2)} mm</strong></div>
          <div>각도(Angle): <strong class="mono" style="color:#38bdf8;">${ang.toFixed(2)}°</strong></div>
          <label style="display:block;margin-top:6px;">시작 X1 / Y1:</label>
          <div style="display:flex;gap:4px;">
            <input id="propX1" type="number" step="any" value="${e.x1.toFixed(2)}" class="form-input mono" />
            <input id="propY1" type="number" step="any" value="${e.y1.toFixed(2)}" class="form-input mono" />
          </div>
          <label style="display:block;margin-top:6px;">끝 X2 / Y2:</label>
          <div style="display:flex;gap:4px;">
            <input id="propX2" type="number" step="any" value="${e.x2.toFixed(2)}" class="form-input mono" />
            <input id="propY2" type="number" step="any" value="${e.y2.toFixed(2)}" class="form-input mono" />
          </div>
        `;
      } else if (e.type === 'circle' || e.type === 'arc') {
        const area = Math.PI * e.r * e.r;
        geomInfo = `
          <div>면적(Area): <strong class="mono" style="color:#38bdf8;">${area.toFixed(1)} mm²</strong></div>
          <label style="display:block;margin-top:6px;">중심 CX / CY:</label>
          <div style="display:flex;gap:4px;">
            <input id="propCx" type="number" step="any" value="${e.cx.toFixed(2)}" class="form-input mono" />
            <input id="propCy" type="number" step="any" value="${e.cy.toFixed(2)}" class="form-input mono" />
          </div>
          <label style="display:block;margin-top:6px;">반지름 (Radius R):</label>
          <input id="propR" type="number" step="any" value="${e.r.toFixed(2)}" class="form-input mono" />
        `;
      }

      const layerOpts = state.layers.map(l => `<option value="${l.name}" ${l.name === e.layer ? 'selected' : ''}>${l.name}</option>`).join('');
      const ltOpts = LINETYPES.map(lt => `<option value="${lt.id}" ${(e.linetype || 'CONTINUOUS') === lt.id ? 'selected' : ''}>${lt.label}</option>`).join('');

      box.innerHTML = `
        <div style="display:flex;flex-direction:column;gap:6px;">
          <div class="layer-row"><span>객체 종류:</span><strong class="mono" style="color:#34d399;">${e.type.toUpperCase()} (선택 ${state.selectedIds.size}개)</strong></div>
          <label>레이어 (Layer):</label>
          <select id="propLayerSel" class="form-input">${layerOpts}</select>
          <label>선종류 (Linetype):</label>
          <select id="propLtSel" class="form-input">${ltOpts}</select>
          <label>색상 (Color):</label>
          <input id="propColorInp" type="color" value="${getEntityColor(e)}" class="form-input" style="height:30px;padding:2px;" />
          ${geomInfo}
          <button id="btnApplyProps" class="btn-confirm" style="height:28px;margin-top:8px;">속성 변경 적용</button>
        </div>
      `;

      document.getElementById('btnApplyProps').addEventListener('click', () => {
        pushHistory();
        e.layer = document.getElementById('propLayerSel').value;
        e.linetype = document.getElementById('propLtSel').value;
        e.color = document.getElementById('propColorInp').value;
        if (e.type === 'line') {
          e.x1 = parseFloat(document.getElementById('propX1').value) || e.x1;
          e.y1 = parseFloat(document.getElementById('propY1').value) || e.y1;
          e.x2 = parseFloat(document.getElementById('propX2').value) || e.x2;
          e.y2 = parseFloat(document.getElementById('propY2').value) || e.y2;
        } else if (e.type === 'circle' || e.type === 'arc') {
          e.cx = parseFloat(document.getElementById('propCx').value) || e.cx;
          e.cy = parseFloat(document.getElementById('propCy').value) || e.cy;
          e.r = Math.max(1, parseFloat(document.getElementById('propR').value) || e.r);
        }
        drawCanvas();
        renderPropsInspector();
        showToast('객체 제원 및 속성이 업데이트되었습니다.');
      });
    }
