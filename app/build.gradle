plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ycad.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.ycad.mobile"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pure Android SDK WebView — zero external AAR resource merge failures
}
