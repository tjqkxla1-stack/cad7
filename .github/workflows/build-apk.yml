name: Build YCAD Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Compile YCAD Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout YCAD Repository (Node 24)
        uses: actions/checkout@v5

      - name: Set up JDK 17 (Node 24)
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Android SDK & Build YCAD APK
        run: |
          set -e
          # Ensure Android SDK environment variables are set on Ubuntu runner
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

          # Download & use Gradle 8.7 directly (avoids Node 20 deprecation warnings)
          GRADLE_VER="8.7"
          curl -sL "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export PATH="/tmp/gradle-${GRADLE_VER}/bin:$PATH"

          # Build Debug and Release APKs
          gradle assembleDebug assembleRelease --no-daemon --stacktrace

          # Prepare output directory
          mkdir -p dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk dist-apk/YCAD-debug.apk

          # Sign the Release APK so Android phones can install it directly
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            keytool -genkey -v -keystore /tmp/ycad-release.jks -keyalg RSA -keysize 2048 -validity 10000 \
              -alias ycad -storepass ycad1234 -keypass ycad1234 \
              -dname "CN=YCAD, OU=Mobile, O=YCAD, L=Seoul, S=Seoul, C=KR"
            BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
            "$BUILD_TOOLS_DIR/zipalign" -v -p 4 \
              app/build/outputs/apk/release/app-release-unsigned.apk \
              /tmp/app-release-aligned.apk
            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks /tmp/ycad-release.jks \
              --ks-pass pass:ycad1234 \
              --key-pass pass:ycad1234 \
              --out dist-apk/YCAD-release-signed.apk \
              /tmp/app-release-aligned.apk
          fi

      - name: Upload YCAD APK Artifact (Node 24)
        uses: actions/upload-artifact@v6
        with:
          name: YCAD-Android-APK
          path: dist-apk/*.apk
          if-no-files-found: error
